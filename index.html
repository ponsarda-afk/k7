<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161f">
<title>K7 Baladeur</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=VT323&family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#14161f; --bg2:#1c1f2b; --card:#232736; --line:#323850;
  --ink:#eef1f7; --muted:#9099b0; --accent:#ff8a1f; --accent2:#ffb347;
  --blue:#3d74e0; --lcd:#030604; --lcdink:#3dff7a; --lcddim:#1d7a3f; --lcdglow:#3dff7a66; --ok:#5ec27a; --warn:#e9b33c; --bad:#e2574c;
  --r:14px;
  --ui:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --hand:"Permanent Marker","Comic Sans MS",cursive;
  --lcdf:"VT323",ui-monospace,"DejaVu Sans Mono",monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px}
body{min-height:100dvh;background:
  radial-gradient(1200px 600px at 80% -10%,#24304d 0,transparent 60%),
  radial-gradient(800px 500px at -10% 110%,#2d1f2a 0,transparent 60%),var(--bg);background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:var(--ink);background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;outline:none}
input:focus,select:focus{border-color:var(--blue)}
.hide{display:none!important}

/* ---------- barre du haut ---------- */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));
  background:rgba(20,22,31,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:.06em}
.logo svg{width:34px;height:22px}
.logo small{display:block;font-weight:400;color:var(--muted);font-size:11px;letter-spacing:.12em}
.top .sp{flex:1}
.ib{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 11px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.ib:active{transform:translateY(1px)}
.ib.acc{background:var(--accent);border-color:var(--accent);color:#1a1006;font-weight:700}

/* ---------- bibliothèque ---------- */
main{max-width:1200px;margin:0 auto;padding:14px 16px 110px}
.resume{display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,#2a3352,#232736);border:1px solid var(--line);border-radius:18px;padding:12px;margin-bottom:14px}
.resume .cv{width:64px;height:64px;border-radius:10px;flex:none;background:#333 center/cover}
.resume .t{flex:1;min-width:0}
.resume .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:16px}
.resume .t span{color:var(--muted);font-size:13px}
.bigplay{width:54px;height:54px;border-radius:50%;border:none;background:var(--accent);color:#1a1006;font-size:22px;flex:none;box-shadow:0 4px 0 #b65c0c}
.bigplay:active{transform:translateY(3px);box-shadow:0 1px 0 #b65c0c}
.pbar{height:5px;border-radius:3px;background:#0005;margin-top:7px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent)}

.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.tools input[type=search]{flex:1;min-width:160px}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--bg2);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--muted)}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.chip .n{opacity:.7;margin-left:4px;font-size:11px}
.grp{margin:18px 0 8px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent2);display:flex;align-items:center;gap:10px}
.grp:after{content:"";flex:1;height:1px;background:var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px 14px}
.tape{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;background:none;border:none;padding:0;text-align:left;position:relative;display:flex;flex-direction:column;gap:7px;min-width:0}
.tape{perspective:1000px}
.case{position:relative;aspect-ratio:70/109;width:89%;margin-left:8%;container-type:inline-size;transform-style:preserve-3d;
  transform:rotateY(24deg);transform-origin:50% 50%;transition:transform .3s cubic-bezier(.2,.8,.3,1)}
.tape:hover .case,.tape:focus-visible .case{transform:rotateY(14deg) translateY(-4px)}
.tape.press .case{transform:rotateY(30deg) scale(.95);transition:transform .45s}
/* face avant : couvercle en plastique transparent */
.front{position:absolute;inset:0;border-radius:4px 5px 5px 4px;overflow:hidden;background:#0d0f15;
  box-shadow:0 18px 22px -10px #000d,6px 10px 16px -6px #0009,0 0 0 1px #ffffff14}
/* tranche (épaisseur 12 mm sur 70) : la jaquette se replie dessus */
.edge{position:absolute;top:0;bottom:0;left:0;width:17cqw;transform-origin:left center;transform:translateZ(-17cqw) rotateY(-90deg);
  border-radius:3px;overflow:hidden;background:linear-gradient(90deg,#00000055,#0000 30%,#0000 70%,#00000070),var(--lab);color:var(--labink);
  box-shadow:inset 0 0 0 1px #ffffff22}
.edge:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#ffffff30,#ffffff08 18%,transparent 40%,#00000030 100%)}
.edge span{position:absolute;inset:6% 0 18%;writing-mode:vertical-rl;transform:rotate(180deg);display:block;text-align:start;padding-top:2px;
  font:800 clamp(8px,8cqw,12px)/1 var(--ui);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.edge i{position:absolute;left:18%;right:18%;bottom:5%;height:9%;border-radius:2px;background:linear-gradient(90deg,#e94f37 0 33%,#f6ae2d 33% 66%,#33a1fd 66%)}
.peek .ph{display:flex;gap:14px;align-items:flex-start;margin-bottom:10px}
.peek .ph img,.peek .ph .cv{width:96px;aspect-ratio:2/3;object-fit:cover;border-radius:6px;flex:none;background:#333}
.peek .ph b{display:block;font-size:18px;line-height:1.2;margin-bottom:4px;text-wrap:balance}
.peek .sum{line-height:1.55;font-size:15px;max-height:46dvh;overflow:auto}
.tape:focus-visible{outline:none}.tape:focus-visible .front{outline:2px solid var(--accent);outline-offset:2px}
/* jaquette */
.jc{position:absolute;inset:0 0 0 9.5%;display:flex;flex-direction:column;background:var(--lab,#f2e8cf);color:var(--labink,#16161a)}
.jc .art{position:relative;flex:1;min-height:0;overflow:hidden;background:#222}
.jc .art img{width:100%;height:100%;object-fit:cover;display:block}
.jc .art.blank{background:
   radial-gradient(120% 70% at 50% 120%,#0000002a,transparent 60%),
   repeating-linear-gradient(0deg,#ffffff10 0 1px,transparent 1px 4px),var(--lab)}
.jc .art.blank .big{position:absolute;inset:10% 24% auto 9%;font:800 clamp(17px,5.2vw,24px)/1.05 var(--ui);letter-spacing:-.01em;
  text-wrap:balance;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;hyphens:manual;overflow-wrap:break-word}
.jc .art.blank .mini-k7{position:absolute;left:9%;right:9%;bottom:8%;height:26%;border-radius:6px;background:#00000022;
  box-shadow:inset 0 0 0 2px #0000001f}
.jc .art.blank .mini-k7:before,.jc .art.blank .mini-k7:after{content:"";position:absolute;top:28%;width:22%;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,#0000 34%,#00000040 36% 58%,#0000 60%)}
.jc .art.blank .mini-k7:before{left:16%}.jc .art.blank .mini-k7:after{right:16%}
.jc .art.blank .addcv{position:absolute;left:50%;bottom:calc(8% + 13%);transform:translate(-50%,50%);white-space:nowrap;
  font:700 12px/1 var(--ui);padding:7px 10px;border-radius:999px;background:#000b;color:#fff;border:1px solid #ffffff55}
.cpgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.cp{position:relative;padding:0;border:2px solid transparent;border-radius:8px;overflow:hidden;background:#000;aspect-ratio:2/3}
.cp img{width:100%;height:100%;object-fit:cover;display:block}
.cp span{position:absolute;left:0;right:0;bottom:0;font-size:10px;padding:3px 5px;background:#000a;color:#fff;text-align:left}
.cp.on,.cp:focus-visible{border-color:var(--accent)}
.jc .lab{padding:7px 9px 8px;background:var(--lab);color:var(--labink);border-top:3px solid #0003}
.jc .lab b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font:700 14px/1.18 var(--ui);letter-spacing:-.005em}
.jc .lab span{display:block;font:500 11.5px/1.3 var(--ui);opacity:.78;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.jc .stripes{height:4px;background:linear-gradient(90deg,#e94f37 0 33%,#f6ae2d 33% 66%,#33a1fd 66%)}
/* tranche (charnière) */
.spine{position:absolute;inset:0 auto 0 0;width:9.5%;background:linear-gradient(90deg,#3a3f4c,#1b1e26 70%,#0c0d12);
  box-shadow:inset -1px 0 0 #ffffff22}
.spine:before{content:"";position:absolute;inset:6% 30%;background:repeating-linear-gradient(0deg,#ffffff1c 0 2px,transparent 2px 6px);border-radius:2px}
/* plastique : reflets */
.front:after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;z-index:2;
  background:linear-gradient(104deg,#ffffff00 0%,#ffffff2e 7%,#ffffff08 16%,transparent 17% 58%,#ffffff12 64%,transparent 74%),
             radial-gradient(120% 50% at 70% -10%,#ffffff22,transparent 60%),
             linear-gradient(0deg,#00000030,transparent 18%);
  box-shadow:inset 0 0 0 1px #ffffff38,inset 0 0 0 3px #ffffff0d,inset 0 2px 0 #ffffff40,inset 0 -2px 0 #00000055,inset -3px 0 6px #00000040}
/* reliefs moulés du couvercle */
.front:before{content:"";position:absolute;left:9.5%;right:0;top:0;height:3.2%;z-index:2;pointer-events:none;
  background:linear-gradient(#ffffff26,#ffffff05);border-bottom:1px solid #00000040}
.case .prog{position:absolute;left:9.5%;right:0;bottom:0;height:4px;background:#0006;z-index:2}
.case .prog i{display:block;height:100%;background:var(--accent)}
.case .done{position:absolute;top:9px;z-index:3;left:calc(9.5% + 7px);z-index:2;font:800 10px/1 var(--ui);letter-spacing:.08em;padding:4px 6px;border-radius:4px;background:var(--ok);color:#0b1d10}
.case .fav{position:absolute;top:30px;left:calc(9.5% + 7px);z-index:2;color:#ffd34d;font-size:16px;text-shadow:0 1px 2px #000}
.tape .meta{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:6px;min-width:0}
.tape .meta b{color:var(--ink);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.st{font-size:10.5px;padding:2px 7px;border-radius:6px;background:#ffffff0d;white-space:nowrap}
.empty{text-align:center;color:var(--muted);padding:50px 10px;line-height:1.6}
.empty .ib{margin:6px}

/* mini lecteur */
.mini{position:fixed;left:0;right:0;bottom:0;z-index:25;display:flex;align-items:center;gap:10px;padding:9px 14px;padding-bottom:max(9px,env(safe-area-inset-bottom));
  background:rgba(28,31,43,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);cursor:pointer}
.mini .cv{width:42px;height:42px;border-radius:7px;background:#333 center/cover;flex:none}
.mini .t{flex:1;min-width:0;font-size:13px}
.mini .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .t span{color:var(--muted)}
.mini button{border:none;background:var(--accent);color:#1a1006;width:42px;height:42px;border-radius:50%;font-size:17px;flex:none}

/* ---------- baladeur ---------- */
#deck{max-width:470px;margin:0 auto;padding:12px 14px 40px}
.wm{position:relative;border-radius:26px 26px 30px 30px;padding:16px 16px 18px;
  background:
   repeating-linear-gradient(90deg,#ffffff07 0 1px,transparent 1px 3px),
   linear-gradient(170deg,#d6dce6 0%,#aab4c4 45%,#8590a3 100%);
  box-shadow:inset 0 2px 0 #fff9,inset 0 -3px 0 #0003,0 22px 40px #000a,0 2px 0 #5c6577;color:#232a38}
.keys{display:grid;grid-template-columns:.8fr 1fr 1fr 1.3fr 1fr 1fr;gap:6px;margin:-34px 6px 14px;position:relative;z-index:2}
.key{height:48px;border:none;border-radius:8px 8px 4px 4px;font-size:16px;color:#e8ecf3;
  background:linear-gradient(#4b5263,#2d323e);box-shadow:inset 0 2px 0 #ffffff30,0 6px 0 #1a1d25,0 8px 10px #0006;transition:transform .06s,box-shadow .06s}
.key small{display:block;font-size:8px;letter-spacing:.1em;opacity:.7;margin-top:1px}
.key:active,.key.down{transform:translateY(5px);box-shadow:inset 0 2px 0 #ffffff20,0 1px 0 #1a1d25,0 2px 4px #0006}
.key.play{background:linear-gradient(#ff9e3d,#e06d0b);color:#2a1300;box-shadow:inset 0 2px 0 #fff6,0 6px 0 #8e4307,0 8px 10px #0006}
.key.play:active,.key.play.down{box-shadow:inset 0 2px 0 #fff4,0 1px 0 #8e4307}
.brand{display:flex;justify-content:space-between;align-items:flex-end;font-size:10px;letter-spacing:.2em;font-weight:800;margin:0 4px 8px}
.brand b{font-size:15px;letter-spacing:.12em}
.brand em{font-style:normal;color:#b2470a}
.win{position:relative;border-radius:16px;padding:10px;background:linear-gradient(#20242e,#0f1117);box-shadow:inset 0 3px 10px #000c,0 1px 0 #fff8}
.win:after{content:"";position:absolute;inset:0;border-radius:16px;pointer-events:none;
  background:linear-gradient(115deg,#ffffff1c 0%,transparent 35%,transparent 70%,#ffffff0c 100%)}
.win svg{display:block;width:100%;height:auto}
.win svg.ins{animation:insert .55s cubic-bezier(.2,.9,.25,1.15)}
@keyframes insert{from{transform:translateY(-38%) scale(.94);opacity:0}60%{opacity:1}}
@media(prefers-reduced-motion:reduce){.win svg.ins{animation:none}}
.lcd{position:relative;overflow:hidden;margin:14px 2px 0;border-radius:10px;padding:9px 13px 8px;
  background:radial-gradient(130% 120% at 50% 0%,#0b1a10 0%,var(--lcd) 70%);color:var(--lcdink);
  box-shadow:inset 0 3px 10px #000,inset 0 0 0 1px #0f2a18,0 1px 0 #fff8;font-family:var(--lcdf);font-size:21px;line-height:1.08;
  text-shadow:0 0 6px var(--lcdglow),0 0 1px var(--lcdink)}
.lcd:after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,#00000038 0 1px,transparent 1px 3px),linear-gradient(115deg,#ffffff0d,transparent 40%)}
.lcd .row{display:flex;justify-content:space-between;gap:8px;white-space:nowrap}
.lcd .ch{overflow:hidden;text-overflow:ellipsis;max-width:70%}
.lcd .dim{color:var(--lcddim);text-shadow:none}
.seek{position:relative;height:22px;margin-top:6px;cursor:pointer;touch-action:none}
.seek .tr{position:absolute;left:0;right:0;top:9px;height:5px;border-radius:1px;
  background:repeating-linear-gradient(90deg,#0f3a1f 0 6px,#071a0e 6px 8px)}
.seek .fl{position:absolute;left:0;top:9px;height:5px;border-radius:1px;
  background:repeating-linear-gradient(90deg,var(--lcdink) 0 6px,#16702f 6px 8px);box-shadow:0 0 8px var(--lcdglow)}
.seek .tk{position:absolute;top:6px;width:2px;height:11px;background:var(--lcddim)}
.seek .kn{position:absolute;top:3px;width:6px;height:17px;margin-left:-3px;background:var(--lcdink);border-radius:1px;box-shadow:0 0 8px var(--lcdink)}
.panel{display:flex;align-items:center;gap:12px;margin:14px 4px 0}
.dial{flex:1}
.dial label{display:flex;justify-content:space-between;font-size:10px;font-weight:800;letter-spacing:.16em;margin-bottom:4px}
.dial input[type=range]{width:100%;padding:0;border:none;background:none;accent-color:#b2470a;height:22px}
.counter{display:flex;gap:2px;padding:4px;border-radius:6px;background:#1b1f28;box-shadow:inset 0 2px 4px #000}
.counter span{width:15px;height:24px;border-radius:2px;background:linear-gradient(#f4f4f4,#cfcfcf 50%,#f0f0f0);color:#111;font-family:var(--lcdf);font-size:22px;line-height:24px;text-align:center}
.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 2px 0}
.mk{border:none;border-radius:10px;padding:8px 2px 6px;font-size:18px;background:linear-gradient(#e8ecf2,#b9c1ce);color:#2a303d;box-shadow:inset 0 1px 0 #fff,0 3px 0 #6f7889}
.mk small{display:block;font-size:9px;font-weight:800;letter-spacing:.08em;margin-top:3px}
.mk:active{transform:translateY(2px);box-shadow:0 1px 0 #6f7889}
.mk.on{background:linear-gradient(#ffb469,#ff8a1f)}
.grill{height:14px;margin:16px 30% 0;border-radius:7px;background:radial-gradient(circle,#404858 1.4px,transparent 1.8px) 0 0/7px 7px}
.decktop{display:flex;align-items:center;gap:10px;margin:2px 0 48px}
.decktop .t{flex:1;min-width:0}
.decktop .t b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.decktop .t span{color:var(--muted);font-size:13px}

/* ---------- feuilles (sheets) ---------- */
.veil{position:fixed;inset:0;z-index:50;background:#0009;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:88dvh;overflow:auto;background:var(--bg2);border:1px solid var(--line);border-bottom:none;
  border-radius:20px 20px 0 0;padding:16px 16px max(18px,env(safe-area-inset-bottom));animation:up .18s ease-out}
@media(min-width:700px){.veil{align-items:center}.sheet{border-radius:20px;border-bottom:1px solid var(--line)}}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
.sheet h3{margin:0 0 12px;font-size:18px;display:flex;align-items:center;gap:8px}
.sheet h3 .x{margin-left:auto;background:none;border:none;font-size:22px;color:var(--muted)}
.fld{display:block;margin-bottom:11px}
.fld>span{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.fld input,.fld select{width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:7px 10px;font-size:13px}
.seg button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:8px;border:2px solid transparent}
.sw.on{border-color:#fff;box-shadow:0 0 0 2px var(--blue)}
.list{display:flex;flex-direction:column;gap:2px}
.li{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;background:none;border:none;text-align:left;width:100%}
.li:hover{background:var(--card)}
.li.cur{background:#3d74e033;outline:1px solid var(--blue)}
.li .n{color:var(--muted);font-family:var(--lcdf);font-size:18px;width:30px;flex:none}
.li .tt{flex:1;min-width:0}
.li .tt b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .tt span{font-size:12px;color:var(--muted)}
.li .d{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.danger{color:var(--bad)!important;border-color:#e2574c66!important}
.note{font-size:12.5px;color:var(--muted);line-height:1.5}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:80;background:#000d;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;max-width:90vw;text-align:center}
.cvpick{display:flex;gap:12px;align-items:center}
.cvpick .cv{width:70px;height:70px;border-radius:10px;background:#333 center/cover;flex:none}
.stars button{background:none;border:none;font-size:24px;color:#555;padding:0 2px}
.stars button.on{color:var(--warn)}
.tape .dbtn{position:absolute;top:9px;right:9px;z-index:4;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:15px;
  background:#000a;color:#fff;border:1px solid #ffffff44;font-weight:700}
.tape .dbtn.has{background:var(--blue)}
.dhead{display:flex;gap:14px;align-items:flex-start;margin-bottom:10px}
.dhead .cv{width:88px;height:88px;border-radius:10px;background:#333 center/cover;flex:none}
.dhead .dt{font-size:19px;display:block;margin-bottom:3px}
.dhead a,.dbody a{color:var(--accent2)}
.dchip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 10px;font-size:12.5px}
.dsec{border-top:1px solid var(--line);padding:6px 0}
.dsec>summary{cursor:pointer;font-weight:700;padding:8px 0;list-style:none;display:flex;gap:8px;align-items:center}

};

const S = () => STATE.settings;
const bs = id => (STATE.books[id] ||= {});

function setSetting(patch){ Object.assign(STATE.settings, patch); BE.saveSettings(patch); }
const bTitle = b => bs(b.id).title || b.title;
const bAuthor = b => bs(b.id).author || b.author;
const bNarr = b => bs(b.id).narrator ?? b.narrator ?? "";

const bDur = b => (b.durations || []).reduce((a,x) => a + (x||0), 0);
function bPosSec(b){ const p = bs(b.id).pos; if (!p) return 0; let s = 0; for (let i=0;i<p.file;i++) s += b.durations[i]||0; return s + (p.t||0); }
function bProg(b){ if (bStatus(b) === "termine") return 1; const d = bDur(b); return d ? Math.min(1, bPosSec(b)/d) : 0; }

/* ================================================================
   Lecture des tags (ID3v2 / MP4) côté navigateur — mode autonome
   ================================================================ */
const sliceBuf = (blob, a, n) => blob.slice(a, a+n).arrayBuffer();
function decText(u8, enc){

    if (u8[0] === 0xFF && u8[1] === 0xFE) { le = true; o = 2; } else if (u8[0] === 0xFE && u8[1] === 0xFF) { le = false; o = 2; }

}
async function readID3(file){
  const h = new Uint8Array(await sliceBuf(file, 0, 10));
  if (h[0] !== 0x49 || h[1] !== 0x44 || h[2] !== 0x33) return null;
  const v = h[3], size = (h[6]<<21)|(h[7]<<14)|(h[8]<<7)|h[9];
  const d = new Uint8Array(await sliceBuf(file, 10, size)); const tags = {}; let p = 0;
  if (h[5] & 0x40) { p = v === 4 ? ((d[0]<<21)|(d[1]<<14)|(d[2]<<7)|d[3]) : 4 + ((d[0]<<24)|(d[1]<<16)|(d[2]<<8)|d[3]); }
  const map = {TIT2:"title",TT2:"title",TALB:"album",TAL:"album",TPE1:"artist",TP1:"artist",TPE2:"album_artist",TP2:"album_artist",
    TCOM:"composer",TCM:"composer",TCON:"genre",TCO:"genre",TYER:"year",TDRC:"year",TYE:"year"};
  while (p < d.length - 10) {
    let id, fs, hl;
    if (v === 2) { id = String.fromCharCode(d[p],d[p+1],d[p+2]); fs = (d[p+3]<<16)|(d[p+4]<<8)|d[p+5]; hl = 6; }
    else { id = String.fromCharCode(d[p],d[p+1],d[p+2],d[p+3]);
      fs = v === 4 ? (d[p+4]<<21)|(d[p+5]<<14)|(d[p+6]<<7)|d[p+7] : ((d[p+4]<<24)|(d[p+5]<<16)|(d[p+6]<<8)|d[p+7])>>>0; hl = 10; }
    if (!/^[A-Z0-9]{3,4}$/.test(id) || fs <= 0 || p + hl + fs > d.length) break;
    const f = d.subarray(p+hl, p+hl+fs);
    if (map[id]) tags[map[id]] ||= decText(f.subarray(1), f[0]).split("\0")[0].trim();
    else if ((id === "APIC" || id === "PIC") && !tags.pic) {
      const enc = f[0]; let q = 1, mime;
      if (id === "PIC") { mime = "image/" + String.fromCharCode(f[1],f[2],f[3]).toLowerCase().replace("jpg","jpeg"); q = 4; }
      else { const e = f.indexOf(0, 1); mime = new TextDecoder().decode(f.subarray(1, e)) || "image/jpeg"; q = e + 1; }
      q++; // type d'image
      if (enc === 1 || enc === 2) { while (q < f.length-1 && !(f[q] === 0 && f[q+1] === 0)) q += 2; q += 2; }
      else { while (q < f.length && f[q] !== 0) q++; q++; }
      if (!mime.includes("/")) mime = "image/jpeg";

async function readMP4(file){
  const head = new Uint8Array(await sliceBuf(file, 4, 4));
  if (String.fromCharCode(...head) !== "ftyp") return null;

  while (off < file.size - 8) {
    const hv = new DataView(await sliceBuf(file, off, 16)); let sz = hv.getUint32(0); const ty = String.fromCharCode(hv.getUint8(4),hv.getUint8(5),hv.getUint8(6),hv.getUint8(7));
    if (sz === 1) sz = Number(hv.getBigUint64(8)); else if (sz === 0) sz = file.size - off;
    if (sz < 8) break;

    off += sz;
  }

      if (sz === 0) sz = e - p; if (sz < 8 || p + sz > e) break; out.push({ty, s:p, e:p+sz}); p += sz; } return out; };

    if (chpl) { let p = chpl.s + 8; const ver = u8[p]; p += 4; if (ver) p += 4; const n = u8[p++]; const ch = [];
      for (let i=0; i<n && p < chpl.e; i++) { const st = Number(moov.getBigUint64(p)) / 1e7; p += 8; const l = u8[p++];
        ch.push({start: st, title: new TextDecoder().decode(u8.subarray(p, p+l))}); p += l; }

    if (meta) { const ilst = find(kids(meta.s+12, meta.e), "ilst");

        const type = moov.getUint32(data.s+8) & 0xFFFFFF; const payload = u8.subarray(data.s+16, data.e);
        const key = {"©nam":"title","©alb":"album","©ART":"artist","aART":"album_artist","©wrt":"composer","©gen":"genre","©day":"year"}[it.ty];
        if (key) tags[key] = new TextDecoder().decode(payload).trim();
        else if (it.ty === "covr" && !tags.pic) tags.pic = new Blob([payload.slice()], {type: type === 14 ? "image/png" : "image/jpeg"});
      } }

}
async function readTags(file){ try { return (await readID3(file)) || (await readMP4(file)) || {}; } catch(e) { console.warn(e); return {}; } }
function mediaDuration(blob){
  return new Promise(res => { const a = new Audio(); const u = URL.createObjectURL(blob); let done = false;
    const fin = d => { if (done) return; done = true; URL.revokeObjectURL(u); a.src = ""; res(isFinite(d) && d > 0 ? d : 0); };

    a.onloadedmetadata = () => { if (isFinite(a.duration)) fin(a.duration); else { a.currentTime = 1e9; a.ondurationchange = () => isFinite(a.duration) && fin(a.duration); } };

// "Karine.Giebel.01.Terminus_Elicius" → "Karine Giebel 01 Terminus Elicius"
const despace = t => (/\s/.test(String(t || "").trim()) && !/_/.test(t)) ? String(t || "").trim() : String(t || "").replace(/(\p{L})[._]+(?=[\p{L}\d])|(\d)[._]+(?=\p{L})/gu, "$1$2 ").replace(/_/g, " ").replace(/\s{2,}/g, " ").trim();
function splitAT(raw, tags, fromFolder = true, parent = ""){
  let name = despace(String(raw).replace(/\[[^\]]*\]/g, "").replace(/\{[^}]*\}/g, "")).replace(/\s{2,}/g, " ").trim();
  tags = {...tags}; for (const k of ["album","artist","album_artist","composer"]) if (tags[k]) tags[k] = despace(tags[k]);
  let series = null; const sm = name.match(/\(([^()]*?)\s*(?:tome|t\.|vol\.?|n°|#|-)?\s*(\d+(?:[.,]\d)?)\)\s*$/i);
  if (sm && sm[1].trim()) { series = {label: sm[1].trim(), ord: sm[2].replace(",", ".")}; name = name.slice(0, sm.index).trim(); }
  else name = name.replace(/\((?:livre audio|audio|int[ée]gral|lu par[^)]*)\)/gi, "").trim();
  let author = "", title = name; const m = fromFolder && name.match(/^(.+?)\s+[-–—]\s+(.+)$/);
  if (m) { author = m[1].trim(); title = m[2].trim();
    const sn = author.match(/^(.+?)\s+(?:t(?:ome)?\.?\s*)?(\d{1,3})$/i), known = (parent && !SKIP_DIR.test(parent) && parent) || tags.album_artist || tags.artist;
    if (sn && known) { series ||= {label: sn[1], ord: sn[2]}; author = despace(known); }
  }
  else if (fromFolder) { // "Prénom Nom 01 Titre" → auteur + tome + titre
    const k = name.match(/^(\p{Lu}[\p{L}'’-]+(?: \p{Lu}[\p{L}'’-]+){1,2}) (\d{1,3}) (.{2,})$/u);
    if (k) { author = k[1]; title = k[3]; }

  title = title.replace(/^\d{1,3}\s*[-–.]?\s+(?=\p{L})/u, "");

/* ================================================================
   Import (mode autonome)
   ================================================================ */
async function importGroups(groups){
  const veil = openSheet(`<h3>Import en cours…</h3><div class="note" id="impMsg">Préparation</div><div class="pbar"><i id="impBar" style="width:0"></i></div>`, false);
  const total = groups.reduce((a,g)=>a+g.audio.length,0); let done = 0; const made = [];
  try { if (navigator.storage?.persist) await navigator.storage.persist(); } catch {}
  for (const g of groups) {
    const audio = g.audio.sort((a,b)=>natcmp(a.webkitRelativePath||a.name, b.webkitRelativePath||b.name));
    const tags = await readTags(audio[0]);
    // nom de dossier (ou fichier unique) = fiable pour « Auteur - Titre » ; plusieurs fichiers en vrac = on se fie aux tags
    const single = audio.length === 1;
    const {author, title, series, reader} = splitAT(g.name || (single ? audio[0].name.replace(/\.[^.]+$/,"") : (tags.album || "Nouveau livre")), tags, !!g.name || single, g.parent || "");
    const id = "L" + Date.now().toString(36) + Math.random().toString(36).slice(2,7);

const SKIP_DIR = /^[!.]|statistics|\.thumbnails|^android$/i;

function filesToGroups(list, byFolder){
  const files = [...list]; const isA = f => AUDIO_RE.test(f.name) || f.type.startsWith("audio/");
  const audio = files.filter(isA), images = files.filter(f => IMG_RE.test(f.name));
  if (!audio.length) { toast("Aucun fichier audio dans la sélection"); return []; }
  if (byFolder) {
    const g = {};
    const parts = f => (f.webkitRelativePath || f.name).split("/").slice(0, -1);
    const bookDir = f => { let p = parts(f); if (p.some(x => SKIP_DIR.test(x))) return null;
      while (p.length > 1 && SUBPART.test(p[p.length-1])) p = p.slice(0, -1);   // CD1/CD2 → même livre
      return p; };
    for (const f of audio) { const p = bookDir(f); if (!p) continue; const k = p.join("/");
      if (p.length === 1) { const k2 = k + "/" + f.name; g[k2] = {name: f.name.replace(/\.[^.]+$/,""), parent: "", path: k2, audio: [f], images: []}; continue; } // fichier seul à la racine
      (g[k] ||= {name: p[p.length-1], parent: p.length > 2 ? p[p.length-2] : "", path: k, audio: [], images: []}).audio.push(f); }
    for (const f of images) { const p = bookDir(f); if (p) g[p.join("/")]?.images.push(f); }
    // un dossier rempli uniquement de .m4b = un livre par m4b
    for (const [k, v] of Object.entries(g)) if (v.audio.length > 1 && v.audio.every(f => /\.m4b$/i.test(f.name))) { delete g[k];
      for (const f of v.audio) g[k + "/" + f.name] = {name: f.name.replace(/\.[^.]+$/,""), parent: v.name, path: k + "/" + f.name, audio: [f], images: v.images}; }
    const known = new Set(BOOKS.map(b => b.rel));
    const out = Object.values(g); const fresh = out.filter(x => !known.has(x.path));
    if (out.length !== fresh.length) toast(`${out.length - fresh.length} livre(s) déjà sur l'étagère, ignorés`);

async function getJSON(url, opt = {}, ms = 25000){
  const c = new AbortController(); const t = setTimeout(() => c.abort(), ms);
  try { const r = await fetch(url, {...opt, signal: c.signal}); if (!r.ok) { const e = new Error(`HTTP ${r.status}`); e.status = r.status; throw e; } return await r.json(); }
  catch(e) { if (e.name === "AbortError") throw new Error("délai dépassé"); throw e; }
  finally { clearTimeout(t); }
}
async function sparql(q){
  const j = await getJSON("https://query.wikidata.org/sparql?format=json&query=" + encodeURIComponent(q));
  return j.results.bindings.map(r => Object.fromEntries(Object.entries(r).map(([k, v]) => [k, v.value])));
}
const QID = u => (u && /\/entity\/(Q\d+)$/.exec(u)) ? /\/entity\/(Q\d+)$/.exec(u)[1] : null;
const yearOf = d => { const m = /^(-?\d{1,4})/.exec(d || ""); return m ? +m[1] : null; };
const sq = s => String(s).replace(/["\\\n]/g, " ");
const isLabelQ = (l, v) => !l || /^Q\d+$/.test(l) || l === v;

function cleanTitle(t){
  return String(t||"")
    .replace(/\[[^\]]*\]|\([^)]*(livre audio|audio|unabridged|int[ée]gral|lu par|narr|mp3|m4b)[^)]*\)/gi, "")
    .replace(/\b(livre audio|audiobook|unabridged|version int[ée]grale|int[ée]gral)\b/gi, "")
    .replace(/\b(tome|vol(ume)?\.?|t\.?|book|partie)\s*\d+\b/gi, "")
    .replace(/^\s*\d+\s*[-–._]\s*/, "").replace(/\s{2,}/g, " ").replace(/[\s:–—-]+$/, "").trim();
}
function authorMatches(cand, wanted){
  const w = norm(wanted).split(" ").filter(x => x.length > 2); if (!w.length) return true;
  const c = norm(cand).split(" "); const last = w[w.length - 1];
  return c.includes(last) || w.some(x => x.length > 3 && c.includes(x));
}

/* ---------- 1. trouver l'œuvre sur Wikidata ---------- */
async function findWork(title, author){
  const unknown = !author || /inconnu/i.test(author);
  for (const lang of ["fr", "en"]) {
    for (const q of unknown ? [title] : [title, `${title} ${author}`]) {
      const rows = await sparql(`SELECT ?w ?wLabel ?wDescription ?a ?aLabel ?num WHERE {
        SERVICE wikibase:mwapi { bd:serviceParam wikibase:api "EntitySearch"; wikibase:endpoint "www.wikidata.org";
          mwapi:search "${sq(q)}"; mwapi:language "${lang}". ?w wikibase:apiOutputItem mwapi:item. ?num wikibase:apiOrdinal true. }
        ?w wdt:P50 ?a.
        SERVICE wikibase:label { bd:serviceParam wikibase:language "fr,en". } } ORDER BY ?num LIMIT 40`);
      const scored = rows.map(r => ({...r, score: (unknown || authorMatches(r.aLabel, author) ? 100 : 0) - (+r.num || 0)
        + (norm(r.wLabel) === norm(title) ? 20 : 0) - (/(édition|edition|traduction|translation)/i.test(r.wDescription || "") ? 30 : 0)}))
        .sort((a, b) => b.score - a.score);
      if (scored[0] && scored[0].score > 50) return {q: QID(scored[0].w), label: scored[0].wLabel, desc: scored[0].wDescription || "", author: scored[0].aLabel, authorQ: QID(scored[0].a)};
    }
  }
  return null;
}

    { BIND("lang" AS ?k) ?w wdt:P407 ?v } UNION { BIND("country" AS ?k) ?w wdt:P495 ?v } UNION
    { BIND("subject" AS ?k) ?w wdt:P921 ?v } UNION { BIND("place" AS ?k) ?w wdt:P840 ?v } UNION

    { BIND("label" AS ?k) ?a rdfs:label ?y. FILTER(LANG(?y) IN ("fr","en")) } UNION

    SERVICE wikibase:label { bd:serviceParam wikibase:language "fr,en". } }`);
  const a = {q, born:null, died:null, bplace:[], dplace:[], countries:[], movements:[], genres:[], jobs:[], infl:[], influenced:[], pseudos:[], notable:[], awards:[], native:"", label:"", desc:"", wiki:{}};
  const push = (arr, r) => { if (!isLabelQ(r.vLabel, QID(r.v)) && !arr.includes(r.vLabel)) arr.push(r.vLabel); };
  for (const r of rows) switch (r.k) {

    case "bplace": push(a.bplace, r); break; case "dplace": push(a.dplace, r); break; case "country": push(a.countries, r); break;
    case "movement": push(a.movements, r); break; case "genre": push(a.genres, r); break; case "job": push(a.jobs, r); break;
    case "infl": push(a.infl, r); break; case "influenced": push(a.influenced, r); break; case "notable": push(a.notable, r); break;
    case "award": push(a.awards, r); break; case "pseudo": a.pseudos.includes(r.y) || a.pseudos.push(r.y); break;
    case "native": a.native ||= r.y; break; case "desc": a.desc ||= r.y; break;
    case "label": if (!a.label || /fr/.test(r.k)) a.label ||= r.y; break;

    FILTER NOT EXISTS { ?w wdt:P31 wd:Q3331189 } FILTER NOT EXISTS { ?w wdt:P31 wd:Q13442814 }
    OPTIONAL { ?w wdt:P577 ?date } OPTIONAL { ?w wdt:P179 ?s } OPTIONAL { ?w wdt:P31 ?t }

async function wikiIntro(url){

}

/* ---------- pochettes : recherche + pose ---------- */
function jsonp(url, ms = 12000){
  return new Promise((res, rej) => { const cb = "k7cb" + Math.random().toString(36).slice(2); const sc = document.createElement("script");
    const done = v => { delete window[cb]; sc.remove(); clearTimeout(t); v instanceof Error ? rej(v) : res(v); };
    const t = setTimeout(() => done(new Error("délai dépassé")), ms);
    window[cb] = done; sc.onerror = () => done(new Error("réseau")); sc.src = url + (url.includes("?") ? "&" : "?") + "callback=" + cb; document.head.appendChild(sc); });
}
async function searchCovers(title, author){
  const t = cleanTitle(title) || title, a = /inconnu/i.test(author) ? "" : author;
  const out = [], seen = new Set();
  const add = (url, src, label, score) => { if (!url || seen.has(url)) return; seen.add(url); out.push({url, src, label, score}); };
  const match = (x, wanted) => !wanted || authorMatches(x || "", wanted);
  const titleOk = x => { const n = norm(x), q = norm(t); return n && q && (n.includes(q) || q.includes(n) || q.split(" ").filter(w => w.length > 3).every(w => n.includes(w))); };
  const jobs = [
    // iTunes / Apple Books : pochettes de livres audio, carrées, 600 px
    ...["audiobook", "ebook"].map(media => jsonp(`https://itunes.apple.com/search?term=${encodeURIComponent((t + " " + a).trim())}&media=${media}&country=FR&limit=12`).then(j =>
      (j.results || []).forEach(r => { const art = (r.artworkUrl100 || r.artworkUrl60 || "").replace(/\/\d+x\d+(bb)?\.(jpg|png)$/, "/600x600bb.jpg");
        add(art, media === "audiobook" ? "Livre audio" : "Livre", `${r.collectionName || r.trackName || ""} — ${r.artistName || ""}`,
          (titleOk(r.collectionName || r.trackName) ? 50 : 0) + (match(r.artistName, a) ? 30 : 0) + (media === "audiobook" ? 10 : 0)); })).catch(() => {})),
    // Google Livres : éditions papier françaises
    getJSON(`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(`intitle:${t}` + (a ? ` inauthor:${a}` : ""))}&maxResults=12&printType=books`).then(j =>
      (j.items || []).forEach(it => { const v = it.volumeInfo || {}; const im = v.imageLinks?.extraLarge || v.imageLinks?.large || v.imageLinks?.thumbnail;
        if (im) add(im.replace(/^http:/, "https:").replace("&edge=curl", "") + (im.includes("fife=") ? "" : "&fife=w800"), "Livre", `${v.title || ""} — ${(v.authors||[]).join(", ")}`,
          (titleOk(v.title) ? 45 : 0) + (match((v.authors||[]).join(" "), a) ? 30 : 0)); })).catch(() => {}),
    // Open Library
    getJSON(`https://openlibrary.org/search.json?title=${encodeURIComponent(t)}${a ? "&author=" + encodeURIComponent(a) : ""}&limit=8&fields=title,author_name,cover_i`).then(j =>
      (j.docs || []).forEach(d => d.cover_i && add(`https://covers.openlibrary.org/b/id/${d.cover_i}-L.jpg`, "Open Library", `${d.title || ""} — ${(d.author_name||[]).join(", ")}`,
        (titleOk(d.title) ? 40 : 0) + (match((d.author_name||[]).join(" "), a) ? 30 : 0)))).catch(() => {}),
  ];
  await Promise.all(jobs);
  return out.sort((x, y) => y.score - x.score);
}
async function setCover(b, src){ // src = Blob (galerie) ou URL (web)
  if (src instanceof Blob) {
    await IDB.put("covers", b.id, src); b.has_cover = true; b.cover_url = null;
    if (LocalBE.coverCache[b.id]) URL.revokeObjectURL(LocalBE.coverCache[b.id]); LocalBE.coverCache[b.id] = URL.createObjectURL(src);
  } else {
    let ok = false;
    try { const r = await fetch(src); if (r.ok) { const bl = await r.blob(); if (bl.type.startsWith("image/") && bl.size > 2000) { await setCover(b, bl); ok = true; } } } catch {}
    if (!ok) { // site sans CORS : on garde l'adresse, le service worker la met en cache pour le hors-ligne
      await IDB.del("covers", b.id); b.has_cover = false; delete LocalBE.coverCache[b.id]; b.cover_url = src;
      try { const c = await caches.open("k7-covers"); const r = await fetch(src, {mode: "no-cors"}); await c.put(src, r); } catch {} }
  }

}
async function grabCover(b, urls){

}

/* ---------- résumés ---------- */
const titleMatch = (x, q) => { const n = norm(cleanTitle(x) || x), t = norm(cleanTitle(q) || q); if (!n || !t) return false;
  return n === t || n.startsWith(t + " ") || t.startsWith(n + " ") || (t.length > 6 && n.includes(t)) || t.split(" ").filter(w => w.length > 3).every(w => n.includes(w)); };
const htmlText = h => { try { const d = new DOMParser().parseFromString(String(h || "").replace(/<br\s*\/?>|<\/p>/gi, "\n"), "text/html"); return (d.body.textContent || "").replace(/\n{3,}/g, "\n\n").trim(); } catch { return String(h || ""); } };
async function fetchSummary(b, info){
  const t = cleanTitle(bTitle(b)) || bTitle(b), a = /inconnu/i.test(bAuthor(b)) ? "" : bAuthor(b);
  // 1. Apple Livres : texte de 4e de couverture, en français
  for (const media of ["audiobook", "ebook"]) {
    if (info.apple?.desc) break;
    try { const j = await jsonp(`https://itunes.apple.com/search?term=${encodeURIComponent((t + " " + a).trim())}&media=${media}&country=FR&limit=10`);
      const hit = (j.results || []).find(r => titleMatch(r.collectionName || r.trackName || "", t) && (!a || authorMatches(r.artistName || "", a)) && r.description);
      if (hit) info.apple = {desc: htmlText(hit.description), url: hit.collectionViewUrl || hit.trackViewUrl || "", src: media === "audiobook" ? "Apple Livres (livre audio)" : "Apple Livres"}; } catch {}
  }
  // 2. Wikipédia FR : article du roman (« Glacé (roman) »)
  if (!info.wiki?.extract) {
    try { const j = await getJSON(`https://fr.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent((t + " " + a).trim())}&srlimit=5&format=json&origin=*`);
      const pg = (j.query?.search || []).find(x => titleMatch(x.title.replace(/\s*\([^)]*\)\s*$/, ""), t) && !(a && norm(x.title) === norm(a)));
      if (pg) info.wiki = await wikiIntro("https://fr.wikipedia.org/wiki/" + encodeURIComponent(pg.title.replace(/ /g, "_"))); } catch {}
  }
  // 3. Google Livres (souvent limité sans clé)
  if (!info.apple?.desc && !info.wiki?.extract) {
    try { const j = await getJSON(`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(`intitle:${t}` + (a ? ` inauthor:${a}` : ""))}&maxResults=8`);

/* ---------- pipeline ---------- */
async function enrich(b, {force = false, log = () => {}} = {}){
  const prev = bInfo(b) || {};
  const info = {...prev, errors: []};
  const title = cleanTitle(bTitle(b)) || bTitle(b), author = bAuthor(b);
  if (force || !prev.at) {
    try { log("Wikidata"); const w = await findWork(title, author);
      if (w) { info.wd = {...await workDetails(w.q), desc: w.desc}; info.wd.label ||= w.label; info.authorQ = w.authorQ; info.authorName = w.author; }
      else { info.wd = null; info.errors.push("Œuvre introuvable sur Wikidata"); } }
    catch(e) { info.errors.push("Wikidata : " + e.message); }
    try { log("Wikipédia"); const w = info.wd?.wiki; info.wiki = await wikiIntro(w?.fr || w?.en); } catch(e) { info.errors.push("Wikipédia : " + e.message); }
    try { log("Open Library"); info.ol = await openLib(title, author); } catch(e) { info.errors.push("Open Library : " + e.message); }
    if (info.authorQ) { const k = aKey(info.authorName || author); const ex = Info.get(k);
      if (force || !ex) { try { log("Auteur"); const a = await authorDetails(info.authorQ); a.wikiIntro = await wikiIntro(a.wiki.fr || a.wiki.en).catch(() => null); a.at = Date.now(); await Info.put(k, a); }
        catch(e) { info.errors.push("Auteur : " + e.message); } }
      info.authorKey = k; }
    log("Résumé"); await fetchSummary(b, info);
    if (!b.has_cover && !b.cover_url) { log("Pochette"); if (!await autoCover(b)) await grabCover(b, [info.ol?.cover && `https://covers.openlibrary.org/b/id/${info.ol.cover}-L.jpg`, info.wiki?.image]); }
    info.at = Date.now();
  }
  await Info.put("b:" + b.id, info);
  return info;
}

let FILL = null;

  if (!todo.length) { if (!silent) toast("Toutes les fiches sont déjà à jour ✓"); return; }
  FILL = {stop: false}; let n = 0;
  if (!silent) { openSheet(`<h3>ⓘ Récupérer les infos <button class="x" id="fillStop">Stop</button></h3>
    <div class="note" id="fillMsg">…</div><div class="pbar"><i id="fillBar" style="width:0"></i></div>`, false);
    $("#fillStop").onclick = () => { FILL.stop = true; }; }
  for (const b of todo) {
    if (FILL.stop || !navigator.onLine) break;
    try { if (bInfo(b)?.at) { if (!bInfo(b).sumTried) await Info.put("b:" + b.id, await fetchSummary(b, {...bInfo(b)})); await autoCover(b); n++; continue; } await enrich(b, {log: x => { const m = $("#fillMsg"); if (m) m.textContent = `${n+1}/${todo.length} · ${bTitle(b)} — ${x}`; }}); } catch {}
    n++; const bar = $("#fillBar"); if (bar) bar.style.width = (n / todo.length * 100) + "%";
    await new Promise(r => setTimeout(r, 500));
  }
  FILL = null; render();
  if (!silent) closeSheet();
}
/* ---------- affichage du dossier ---------- */
const ADAPT_ICON = t => /film|cin[ée]ma|movie/i.test(t) ? "🎬" : /s[ée]rie|t[ée]l[ée]|tv|anim/i.test(t) ? "📺" : /bd|bande|comic|manga|graphi|illustr/i.test(t) ? "🖼" :
  /th[ée][aâ]tre|pi[eè]ce|play/i.test(t) ? "🎭" : /radio|audio|podcast/i.test(t) ? "📻" : /jeu|game|rôle|rpg/i.test(t) ? "🎮" : /op[ée]ra|music|chanson|album|ballet/i.test(t) ? "🎼" : "✨";
const chipsH = arr => (arr||[]).filter(Boolean).length ? `<div class="seg" style="margin:4px 0 8px">${arr.filter(Boolean).map(x => `<span class="dchip">${esc(x)}</span>`).join("")}</div>` : "";
const inLib = label => { const n = norm(cleanTitle(label)); return n && BOOKS.find(x => norm(cleanTitle(bTitle(x))) === n || norm(bInfo(x)?.wd?.label) === n); };
const sec = (icon, title, body, open = true) => body ? `<details class="dsec" ${open ? "open" : ""}><summary>${icon} ${title}</summary><div class="dbody">${body}</div></details>` : "";
const para = t => t ? `<p>${esc(t).replace(/\n+/g, "</p><p>")}</p>` : "";

function openDossier(b){
  const i = bInfo(b); const ai = i?.ai || {}; const wd = i?.wd; const cv = coverOf(b);
  const year = bYear(b), genres = bGenres(b), ser = bSeries(b);
  const author = i?.authorKey ? Info.get(i.authorKey) : null;
  let h = `<h3>📖 Dossier <button class="x" data-close>×</button></h3>
   <div class="dhead"><div class="cv" style="${cv ? `background-image:url('${cv}')` : `background:${bColor(b)}`}"></div><div>
     <b class="dt">${esc(bTitle(b))}</b>
     <div class="note">${i?.authorKey ? `<a href="#" id="dAuth">${esc(bAuthor(b))} ›</a>` : esc(bAuthor(b))}${year ? " · " + year : ""}${ai.titre_original && norm(ai.titre_original) !== norm(bTitle(b)) ? `<br>Titre original : <i>${esc(ai.titre_original)}</i>` : ""}
     ${ser ? `<br>📚 ${esc(ser.label)}${ser.ord ? " — tome " + esc(ser.ord) : ""}` : ""}</div>
     ${chipsH(genres)}</div></div>
   <div class="btns" style="margin-top:0"><button class="ib acc" id="dPlay">▶ Écouter</button><button class="ib" id="dRef">↻ Actualiser</button></div>`;
  if (!i?.at) h += `<p class="note" style="margin-top:14px">${navigator.onLine ? "Recherche des infos…" : "Pas encore d'infos : elles se chargent toutes seules dès que le téléphone a du réseau."}</p>`;
  h += `<div style="height:8px"></div>`;
  { const sm = bSummary(b); const srcName = ai.resume_sans_spoiler ? "" : i?.apple?.desc ? i.apple.src : i?.gbooks?.desc ? i.gbooks.src : i?.wiki?.extract ? "Wikipédia" : "";
    h += sec("📜", "Résumé", sm ? para(sm) + (srcName ? `<p class="note">Source : ${esc(srcName)}</p>` : "") : ""); }
  if (i?.apple?.desc && i?.wiki?.extract) h += sec("📚", "Wikipédia", para(i.wiki.extract), false);
  h += sec("🔒", "Résumé intégral — SPOILERS", para(ai.resume_complet_spoilers), false);
  if (ser) {
    const mem = wd?.series?.members?.length ? wd.series.members : (ai.serie?.ordre_lecture || []).map((m, k) => ({label: m.titre, year: m.annee, ord: String(k + 1)}));
    const miss = mem.filter(m => !inLib(m.label)).length;
    h += sec("📚", `Série : ${esc(ser.label)}`, (mem.length ? `<div class="list">${mem.map(m => { const own = inLib(m.label); const cur = own?.id === b.id;
        return `<div class="li ${cur ? "cur" : ""}"><span class="n">${esc(m.ord || "·")}</span><span class="tt"><b>${esc(m.label)}</b><span>${m.year || ""}</span></span><span class="d">${cur ? "▶ ici" : own ? "✓ à toi" : "○ manque"}</span></div>`; }).join("")}</div>
        <p class="note">${miss ? `Il te manque ${miss} tome${miss>1?"s":""} sur ${mem.length}.` : "Tu as toute la série ✓"}</p>` : "")
      + (ai.serie?.ordre_chronologique_interne ? `<p class="note">⏳ Ordre chronologique de l'histoire : ${esc(ai.serie.ordre_chronologique_interne)}</p>` : "")
      + (wd?.follows || wd?.followedBy ? `<p class="note">${wd.follows ? "◀ Précédent : " + esc(wd.follows.label) : ""}${wd.follows && wd.followedBy ? "<br>" : ""}${wd.followedBy ? "▶ Suivant : " + esc(wd.followedBy.label) : ""}</p>` : ""));
  }
  // adaptations : Wikidata + IA, fusionnées
  const ads = [...(wd?.adaptations || [])];
  for (const a of ai.adaptations || []) { if (!a?.titre) continue; const ex = ads.find(x => norm(x.title) === norm(a.titre) && (!x.year || !a.annee || Math.abs(x.year - +a.annee) < 2));
    if (ex) { ex.note ||= a.note; ex.by.length || (a.par && ex.by.push(a.par)); if (!ex.types.length && a.type) ex.types.push(a.type); }
    else ads.push({title: a.titre, types: [a.type || ""], year: +a.annee || null, by: a.par ? [a.par] : [], note: a.note, src: "IA"}); }
  ads.sort((x, y) => (x.year || 9999) - (y.year || 9999));
  h += sec("🎬", `Adaptations (${ads.length})`, ads.length ? `<div class="list">${ads.map(a => `<div class="li"><span class="n" style="font-size:20px">${ADAPT_ICON(a.types.join(" "))}</span>
      <span class="tt"><b>${esc(a.title)}</b><span>${esc(a.types.filter(Boolean).join(", "))}${a.by.length ? " · " + esc(a.by.join(", ")) : ""}${a.note ? " · " + esc(a.note) : ""}</span></span>
      <span class="d">${a.year || ""}<br><small style="opacity:.6">${a.src}</small></span></div>`).join("")}</div>` : (i?.at ? `<p class="note">Aucune adaptation connue des sources.</p>` : ""));
  // titres dans le monde
  const titles = {}; const add = (lang, t) => { if (!t) return; const k = norm(t); if (!k) return; (titles[k] ||= {t, langs: new Set()}).langs.add(lang); };
  Object.entries(wd?.labels || {}).forEach(([l, t]) => add(l, t)); Object.entries(wd?.alts || {}).forEach(([l, ts]) => ts.forEach(t => add(l, t)));
  (ai.titres_alternatifs || []).forEach(x => add(x.langue || "?", x.titre));
  const tl = Object.values(titles).filter(x => norm(x.t) !== norm(bTitle(b)));
  h += sec("🌍", `Titres dans le monde (${tl.length})`, tl.length ? `<div class="list">${tl.slice(0, 80).map(x => `<div class="li" style="padding:6px 10px"><span class="tt"><b>${esc(x.t)}</b><span>${esc([...x.langs].map(langName).join(", "))}</span></span></div>`).join("")}</div>` : "", false);
  h += sec("🔍", "Interprétations", (ai.interpretations || []).map(x => `<div class="dcard"><b>${esc(x.angle)}</b>${x.qui ? ` <span class="note">— ${esc(x.qui)}</span>` : ""}<p>${esc(x.lecture)}</p></div>`).join(""));
  h += sec("📣", "Réception dans le monde", (ai.reception || []).map(x => `<div class="dcard"><b>${esc(x.ou_quand)}</b><p>${esc(x.accueil)}</p></div>`).join(""));
  h += sec("⚠", "Controverses & censure", (ai.controverses || []).map(x => typeof x === "string" ? `<div class="dcard"><p>${esc(x)}</p></div>` : `<div class="dcard"><b>${esc(x.ou_quand || "")}</b><p>${esc(x.quoi)}</p></div>`).join(""));
  h += sec("🧭", "Thèmes, lieux, époque", [ai.themes?.length && `<b>Thèmes</b>${chipsH(ai.themes)}`, wd?.subjects?.length && `<b>Sujets</b>${chipsH(wd.subjects)}`,
    (wd?.places?.length || i?.ol?.places?.length) && `<b>Lieux</b>${chipsH([...(wd?.places||[]), ...(i?.ol?.places||[])].slice(0, 20))}`,
    (wd?.periods?.length || i?.ol?.times?.length) && `<b>Époque</b>${chipsH([...(wd?.periods||[]), ...(i?.ol?.times||[])])}`,
    ai.style && `<b>Style</b>${para(ai.style)}`, i?.ol?.subjects?.length && `<b>Mots-clés Open Library</b>${chipsH(i.ol.subjects)}`].filter(Boolean).join(""), false);
  h += sec("👥", "Personnages", (ai.personnages?.length ? `<div class="list">${ai.personnages.map(p => `<div class="li" style="padding:6px 10px"><span class="tt"><b>${esc(p.nom)}</b><span>${esc(p.role)}</span></span></div>`).join("")}</div>` : "")
    + (wd?.characters?.length && !ai.personnages?.length ? chipsH(wd.characters) : ""), false);
  h += sec("🖋", "Contexte d'écriture & héritage", [para(ai.contexte_ecriture), ai.influences_et_heritage && `<b>Héritage</b>${para(ai.influences_et_heritage)}`,
    wd?.inspired?.length && `<b>Inspiré par</b>${chipsH(wd.inspired)}`, wd?.basedOn?.length && `<b>D'après</b>${chipsH(wd.basedOn)}`].filter(Boolean).join(""), false);
  h += sec("🏆", "Prix", chipsH(wd?.awards), false);
  h += sec("💡", "Anecdotes", (ai.anecdotes || []).map(x => `<div class="dcard"><p>${esc(x)}</p></div>`).join(""), false);
  h += sec("❤", "Si tu aimes ce livre…", (ai.si_tu_aimes || []).map(x => `<div class="dcard"><b>${esc(x.titre)}</b> <span class="note">— ${esc(x.auteur)}${inLib(x.titre) ? " · ✓ déjà sur ton étagère" : ""}</span><p>${esc(x.pourquoi)}</p></div>`).join(""), false);
  if (author || ai.auteur) h += sec("✍", `L'auteur : ${esc(bAuthor(b))}`, `${author ? `<p class="note">${[author.born && "Né·e " + author.born.slice(0,4) + (author.bplace[0] ? " à " + author.bplace[0] : ""),
      author.died && "mort·e " + author.died.slice(0,4) + (author.dplace[0] ? " à " + author.dplace[0] : "")].filter(Boolean).join(" · ")}</p>` : ""}
    ${para(ai.auteur?.bio || author?.wikiIntro?.extract?.slice(0, 900))}${i?.authorKey ? `<button class="ib" id="dAuth2">Fiche auteur complète ›</button>` : ""}`, false);
  const src = [wd && `<a href="https://www.wikidata.org/wiki/${wd.q}" target="_blank" rel="noopener">Wikidata ${wd.q}</a>`, i?.wiki?.url && `<a href="${esc(i.wiki.url)}" target="_blank" rel="noopener">Wikipédia (${i.wiki.lang})</a>`,
    i?.ol?.key && `<a href="https://openlibrary.org${esc(i.ol.key)}" target="_blank" rel="noopener">Open Library</a>`].filter(Boolean).join(" · ");
  h += sec("🔗", "Sources & fiabilité", `${src ? `<p>${src}</p>` : ""}${ai._at ? `<p class="note">Partie IA : ${esc(ai._model)} le ${new Date(ai._at).toLocaleDateString("fr-FR")} — à recouper, une IA peut se tromper.${ai.fiabilite ? "<br>Note de fiabilité : " + esc(ai.fiabilite) : ""}</p>` : ""}
    ${i?.at ? `<p class="note">Sources consultées le ${new Date(i.at).toLocaleDateString("fr-FR")}.</p>` : ""}${i?.errors?.length ? `<p class="note">⚠ ${i.errors.map(esc).join("<br>⚠ ")}</p>` : ""}`, false);
  openSheet(h);
  $("#dPlay").onclick = () => { closeSheet(); if (player.book?.id === b.id) { showDeck(); play(); } else openBook(b, true); };
  const run = async (opts, btn) => { btn.disabled = true; const old = btn.textContent;
    try { await enrich(b, {...opts, log: s => btn.textContent = "… " + s}); render(); openDossier(b); }
    catch(e) { btn.textContent = old; btn.disabled = false; toast(e.message, 5000); } };
  $("#dRef").onclick = e => run({force: true}, e.target);
  if (!i?.at && navigator.onLine) enrich(b).then(() => { if ($("#dRef")) openDossier(b); render(); }).catch(() => {});
  for (const id of ["#dAuth", "#dAuth2"]) { const el = $(id); if (el) el.onclick = ev => { ev.preventDefault(); openAuthor(i.authorKey, b); }; }
}

function openAuthor(key, from){
  const a = Info.get(key); if (!a) return;
  const mine = BOOKS.filter(x => bInfo(x)?.authorKey === key);
  const yrs = [a.born?.slice(0,4), a.died?.slice(0,4)].filter(Boolean).join(" – ");
  let h = `<h3>✍ ${esc(a.label || bAuthor(from))} <button class="x" data-close>×</button></h3>
    <p class="note">${[yrs, a.native && a.native !== a.label && a.native, a.desc].filter(Boolean).map(esc).join(" · ")}</p>
    ${a.pseudos.length ? `<p class="note">Pseudonymes : ${a.pseudos.map(esc).join(", ")}</p>` : ""}
    <p class="note">${[a.bplace[0] && "Naissance : " + a.bplace[0], a.dplace[0] && "Mort : " + a.dplace[0], a.countries.length && "Nationalité : " + a.countries.join(", ")].filter(Boolean).map(esc).join("<br>")}</p>
    <button class="ib" id="aBack">◀ Retour au dossier</button><div style="height:8px"></div>`;
  h += sec("📜", "Biographie", para(a.ai?.bio) + (a.wikiIntro?.extract ? `<details><summary class="note">Intro Wikipédia</summary>${para(a.wikiIntro.extract)}</details>` : ""));
  h += sec("🎨", "Style, mouvements, genres", (a.ai?.style ? para(a.ai.style) : "") + chipsH([...a.movements, ...a.genres]) + chipsH(a.jobs));
  h += sec("🧬", "Influences", (a.infl.length ? `<b>A été influencé·e par</b>${chipsH(a.infl)}` : "") + ((a.influenced.length || a.ai?.a_influence?.length) ? `<b>A influencé</b>${chipsH([...new Set([...a.influenced, ...(a.ai?.a_influence||[])])])}` : ""), false);
  h += sec("📅", `Bibliographie chronologique (${a.works.length})`, `<p class="note">✓ = sur ton étagère · ${mine.length} livre${mine.length>1?"s":""} à toi</p><div class="list">${a.works.map(w => { const own = inLib(w.label);
      return `<div class="li" style="padding:6px 10px"><span class="n">${w.year ?? "?"}</span><span class="tt"><b>${esc(w.label)}</b><span>${esc([w.type, w.series].filter(Boolean).join(" · "))}</span></span><span class="d">${own ? "✓" : ""}</span></div>`; }).join("")}</div>`);
  h += sec("🏆", "Prix", chipsH(a.awards), false);
  h += sec("🔗", "Sources", `<p><a href="https://www.wikidata.org/wiki/${a.q}" target="_blank" rel="noopener">Wikidata</a>${a.wikiIntro?.url ? ` · <a href="${esc(a.wikiIntro.url)}" target="_blank" rel="noopener">Wikipédia</a>` : ""}</p>`, false);
  openSheet(h);
  $("#aBack").onclick = () => openDossier(from);
}

/* ---------- appui long sur un boîtier : résumé ---------- */
function bSummary(b){
  const i = bInfo(b); if (!i) return "";
  return i.ai?.resume_sans_spoiler || i.apple?.desc || i.gbooks?.desc || i.wiki?.extract || i.wd?.desc || "";
}
function openPeek(b){
  const cv = coverOf(b), ser = bSeries(b), yr = bYear(b), sum = bSummary(b);
  openSheet(`<div class="peek"><h3 style="margin-bottom:8px">Résumé <button class="x" data-close>×</button></h3>
    <div class="ph">${cv ? `<img src="${esc(cv)}" alt="">` : `<div class="cv" style="background:${bColor(b)}"></div>`}
      <div><b>${esc(bTitle(b))}</b><span class="note">${esc(bAuthor(b))}${yr ? " · " + yr : ""}${ser ? `<br>📚 ${esc(ser.label)}${ser.ord ? " — tome " + esc(ser.ord) : ""}` : ""}<br>${fmtLong(bDur(b))}${bNarr(b) ? " · lu par " + esc(bNarr(b)) : ""}</span></div></div>
    <div class="sum" id="pkSum">${sum ? `<p>${esc(sum).replace(/\n+/g, "</p><p>")}</p>` : `<p class="note">${navigator.onLine ? "Recherche du résumé…" : "Pas encore de résumé : il se charge tout seul dès que le téléphone a du réseau."}</p>`}</div>
    <div class="btns"><button class="ib acc" id="pkPlay">▶ Écouter</button><button class="ib" id="pkDos">📖 Dossier complet</button></div></div>`);
  $("#pkPlay").onclick = () => { closeSheet(); if (player.book?.id === b.id) { showDeck(); play(); } else openBook(b, true); };
  $("#pkDos").onclick = () => openDossier(b);
  const getSum = async () => { const i = bInfo(b); if (!i?.at) return enrich(b); const n = await fetchSummary(b, {...i}); await Info.put("b:" + b.id, n); };
  if (!sum && navigator.onLine) getSum().then(() => { const el = $("#pkSum"); if (!el) return;
    const t = bSummary(b); el.innerHTML = t ? `<p>${esc(t).replace(/\n+/g, "</p><p>")}</p>` : `<p class="note">Aucun résumé trouvé pour « ${esc(bTitle(b))} » de ${esc(bAuthor(b))}. Si le titre ou l'auteur est mal écrit, corrige-le dans ✎ Fiche puis réessaie.</p>`; render(); }).catch(() => {});
}
(() => { // appui long (doigt) ou clic droit (souris)
  let timer = null, startX = 0, startY = 0, fired = false, el = null;
  const cancel = () => { clearTimeout(timer); timer = null; el?.classList.remove("press"); };
  document.addEventListener("pointerdown", e => {
    const t = e.target.closest(".tape"); if (!t || e.target.closest("[data-dos],[data-cover]") || e.button > 0) return;
    el = t; fired = false; startX = e.clientX; startY = e.clientY; t.classList.add("press");
    timer = setTimeout(() => { fired = true; t.classList.remove("press"); try { navigator.vibrate?.(15); } catch {} openPeek(BOOKS.find(x => x.id === t.dataset.open)); }, 480);
  });
  document.addEventListener("pointermove", e => { if (timer && Math.hypot(e.clientX - startX, e.clientY - startY) > 10) cancel(); });
  document.addEventListener("pointerup", cancel); document.addEventListener("pointercancel", cancel);
  document.addEventListener("click", e => { if (fired && e.target.closest(".tape")) { e.stopPropagation(); e.preventDefault(); fired = false; } }, true);
  document.addEventListener("contextmenu", e => { const t = e.target.closest(".tape"); if (!t) return; e.preventDefault();
    if (!fired && e.pointerType !== "touch" && matchMedia("(hover:hover)").matches) { cancel(); openPeek(BOOKS.find(x => x.id === t.dataset.open)); } });
})();

   ${allShelves.length ? `<div class="seg" style="margin:-4px 0 12px">${allShelves.map(s => `<button data-addsh="${esc(s)}">+ ${esc(s)}</button>`).join("")}</div>` : ""}
   <div class="fld"><span>Note & favori</span><div style="display:flex;align-items:center;gap:14px"><div class="stars" id="bkR">${[1,2,3,4,5].map(i => `<button data-r="${i}" class="${i<=rating?"on":""}">★</button>`).join("")}</div>
     <label style="display:flex;gap:6px;align-items:center;white-space:nowrap"><input type="checkbox" id="bkF" ${st.fav ? "checked" : ""}> Favori (face ★)</label></div></div>

     <button class="ib" id="bkReset">⏪ Remettre au début</button>
     ${true ? `<button class="ib danger" id="bkDel">🗑 Supprimer</button>` : ""}</div>`);
  $("#bkS").onclick = e => { const v = e.target.dataset.v; if (!v) return; status = v; [...$("#bkS").children].forEach(x => x.classList.toggle("on", x.dataset.v === v)); };
  $("#bkR").onclick = e => { const r = +e.target.dataset.r; if (!r) return; rating = rating === r ? 0 : r; [...$("#bkR").children].forEach((x,i) => x.classList.toggle("on", i < rating)); };
  $("#bkC").onclick = e => { const c = e.target.dataset.c; if (!c) return; color = c; [...$("#bkC").children].forEach(x => x.classList.toggle("on", x.dataset.c === c)); if (!cv) $("#bkCv").style.background = c; };
  document.querySelectorAll("[data-addsh]").forEach(x => x.onclick = () => { const cur = $("#bkSh").value.split(",").map(s=>s.trim()).filter(Boolean);
    if (!cur.includes(x.dataset.addsh)) cur.push(x.dataset.addsh); $("#bkSh").value = cur.join(", "); });
  if ($("#bkCvBtn")) $("#bkCvBtn").onclick = () => openCoverPicker(b, () => openBookSheet(b));
  $("#bkOk").onclick = () => {
    const t = $("#bkT").value.trim(), a = $("#bkA").value.trim(), n = $("#bkN").value.trim();
    setBook(b.id, { title: t && t !== b.title ? t : null, author: a && a !== b.author ? a : null, narrator: n !== (b.narrator||"") ? n : null,
      status, rating: rating || null, fav: $("#bkF").checked || null, color: color !== hashCol(b.id) ? color : null,
      shelves: (() => { const s = [...new Set($("#bkSh").value.split(",").map(x => x.trim()).filter(Boolean))]; return s.length ? s : null; })() });
    closeSheet(); render(); if (player.book?.id === b.id) { drawDeckStatic(); updateUI(); mediaMeta(); } toast("Fiche enregistrée");
  };
  $("#bkDos").onclick = () => openDossier(b);
  $("#bkReset").onclick = () => { setBook(b.id, {pos: {file:0, t:0}, status: "a-lire"}); if (player.book?.id === b.id) seekG(0); closeSheet(); render(); };
  if ($("#bkDel")) $("#bkDel").onclick = async () => { if (!confirm(`Supprimer « ${bTitle(b)} » de l'appli ? (les fichiers copiés seront effacés)`)) return;
    if (player.book?.id === b.id) { pause(); A.src = ""; player.book = null; }
    await LocalBE.remove(b); Info.del("b:" + b.id); BOOKS = BOOKS.filter(x => x.id !== b.id); closeSheet(); showLib(); toast("Livre supprimé"); };
}

async function openSettings(){
  const s = S(); let storage = "";
  if (navigator.storage?.estimate) { const e = await navigator.storage.estimate(); const p = await navigator.storage.persisted?.();
    storage = `<p class="note">Stockage utilisé : <b>${(e.usage/1e9).toFixed(2)} Go</b> sur ${(e.quota/1e9).toFixed(0)} Go dispo pour l'appli · ${p ? "✅ protégé (Android ne l'effacera pas)" : "⚠ non protégé : installe l'appli sur l'écran d'accueil"}</p>`; }
  const seg = (id, vals, cur, suf="") => `<div class="seg" id="${id}">${vals.map(v => `<button data-v="${v}" class="${v==cur?"on":""}">${v}${suf}</button>`).join("")}</div>`;
  openSheet(`<h3>⚙ Réglages <button class="x" data-close>×</button></h3>
   ${storage}<div class="btns" style="margin:0 0 14px"><button class="ib acc" data-act="addfiles">＋ Fichiers</button><button class="ib" data-act="adddir">＋ Dossier(s)</button></div>
   <div class="btns" style="margin:0 0 14px"><button class="ib" id="fillAll">ⓘ Récupérer les infos de tous les livres</button></div>
   <p class="note" style="margin-top:-6px">Résumé, série, année, genres, adaptations, auteur — depuis Wikipédia, Wikidata et Open Library. Ça se fait aussi tout seul après chaque import.</p>
   <h3 style="font-size:15px">▶ Lecture</h3>
   <div class="fld"><span>Bouton ◀◀ recule de</span>${seg("stBack",[5,10,15,30,60],s.back||15," s")}</div>
   <div class="fld"><span>Bouton ▶▶ avance de</span>${seg("stFwd",[10,15,30,60,120],s.fwd||30," s")}</div>
   <div class="fld"><span>Recul auto à la reprise (×3 après 30 min de pause)</span>${seg("stRw",[0,3,5,10,20],s.rewind??5," s")}</div>
   <label class="fld" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="stClick" ${s.clicks!==false?"checked":""}> Bruits de touches mécaniques</label>
   <label class="fld" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="stHiss" ${s.hiss?"checked":""}> Souffle de bande (léger « shhh » de cassette)</label>
   <p class="note">Maintenir ◀◀ ou ▶▶ = rembobinage/avance rapide continue. Double-tap sur VITESSE = ×1. Les touches du casque et de l'écran verrouillé marchent (◀◀/▶▶ = chapitres).</p>`);
  const bindSeg = (id, key) => $("#"+id).onclick = e => { const v = e.target.dataset.v; if (v == null) return; setSetting({[key]: +v}); [...$("#"+id).children].forEach(x => x.classList.toggle("on", x.dataset.v === v)); if (player.book) drawDeckStatic(); };
  bindSeg("stBack","back"); bindSeg("stFwd","fwd"); bindSeg("stRw","rewind");
  $("#stClick").onchange = e => setSetting({clicks: e.target.checked});
  $("#stHiss").onchange = e => { setSetting({hiss: e.target.checked}); hiss(!A.paused); };
  $("#fillAll").onclick = () => { closeSheet(); fillAll(); };
}

/* ================================================================
   Démarrage
   ================================================================ */
(async function boot(){
  BE = LocalBE;
  try { await BE.load(); } catch(e) { toast("Erreur de chargement : " + e.message, 6000); }
  await LocalBE.warmCovers(); await Info.loadAll();
  for (const b of BOOKS) { // noms à points/tirets bas importés avant la correction
    if (!/\p{L}[._]\p{L}|_| [-–—] /u.test(b.title + " " + b.author) || /\.\s|\b\p{L}\.\p{L}\./u.test(b.author)) continue;
    const raw = String(b.rel || b.title).split("/").pop(), parent = String(b.rel || "").split("/").slice(-2, -1)[0] || "";
    const r = splitAT(raw, {artist: b.author}, true, parent);
    b.title = r.title; b.author = r.author; if (r.series && !b.series) b.series = r.series; if (r.reader && !b.narrator) b.narrator = r.reader;
    if (Info.get("b:" + b.id) && !Info.get("b:" + b.id).wd) Info.del("b:" + b.id);
    LocalBE.saveMeta(b);
  }
  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
  A.volume = S().vol ?? 1;
  render(); setTimeout(() => fillAll(true), 4000);
  const last = BOOKS.filter(b => bs(b.id).last).sort((a,b) => bs(b.id).last - bs(a.id).last)[0];
  if (last) { player.book = last; const p = bs(last.id).pos || {file:0,t:0}; loadFile(Math.min(p.file, last.files.length-1), p.t||0, false).then(() => { mediaMeta(); renderMini(); }); }
})();
</script>
