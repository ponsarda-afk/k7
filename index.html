<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161f">
<title>K7 AudioB</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preload" href="fonts/vt323-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Archivo";font-weight:400;font-display:swap;src:url(fonts/archivo-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Archivo";font-weight:500;font-display:swap;src:url(fonts/archivo-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Archivo";font-weight:600;font-display:swap;src:url(fonts/archivo-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Archivo";font-weight:700;font-display:swap;src:url(fonts/archivo-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Archivo";font-weight:800;font-display:swap;src:url(fonts/archivo-latin-800-normal.woff2) format("woff2")}
@font-face{font-family:"VT323";font-display:swap;src:url(fonts/vt323-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Permanent Marker";font-display:swap;src:url(fonts/permanent-marker-latin-400-normal.woff2) format("woff2")}
:root{
  --bg:#14161f; --bg2:#1c1f2b; --card:#232736; --line:#323850;
  --ink:#eef1f7; --muted:#9099b0; --accent:#ff8a1f; --accent2:#ffb347;
  --blue:#3d74e0; --lcd:#030604; --lcdink:#3dff7a; --lcddim:#1d7a3f; --lcdglow:#3dff7a66; --ok:#5ec27a; --warn:#e9b33c; --bad:#e2574c;
  --r:14px;
  --ui:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --hand:"Permanent Marker","Comic Sans MS",cursive;
  --lcdf:"VT323",ui-monospace,"DejaVu Sans Mono",monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px}
body{min-height:100dvh;background:
  radial-gradient(1200px 600px at 80% -10%,#24304d 0,transparent 60%),
  radial-gradient(800px 500px at -10% 110%,#2d1f2a 0,transparent 60%),var(--bg);background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:var(--ink);background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;outline:none}
input:focus,select:focus{border-color:var(--blue)}
.hide{display:none!important}

/* ---------- barre du haut ---------- */
.top{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:46px 1fr 46px;align-items:center;gap:8px;padding:6px 16px;padding-top:max(6px,env(safe-area-inset-top));
  background:rgba(20,22,31,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;justify-self:center}
.logo svg{width:58px;height:54px;flex:none}
.logo .capy-logo{height:58px;width:auto;flex:none;margin-left:-4px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.4))}
.wordmark{display:flex;flex-direction:column;line-height:1}
.wordmark b{font-weight:800;font-size:27px;letter-spacing:.02em;color:var(--accent)}
.wordmark small{font-weight:600;font-size:10.5px;letter-spacing:.32em;color:var(--muted);margin-top:4px}
.gear{width:46px;height:46px;justify-content:center;font-size:19px;padding:0}
.ib{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 11px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.ib:active{transform:translateY(1px)}
.ib.acc{background:var(--accent);border-color:var(--accent);color:#1a1006;font-weight:700}

/* ---------- bibliothèque ---------- */
main{max-width:1200px;margin:0 auto;padding:14px 16px 110px}
.resume{display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,#2a3352,#232736);border:1px solid var(--line);border-radius:18px;padding:12px;margin-bottom:14px}
.resume .cv{width:64px;height:64px;border-radius:10px;flex:none;background:#333 center/cover}
.resume .t{flex:1;min-width:0}
.resume .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:16px}
.resume .t span{color:var(--muted);font-size:13px}
.bigplay{width:54px;height:54px;border-radius:50%;border:none;background:var(--accent);color:#1a1006;font-size:22px;flex:none;box-shadow:0 4px 0 #b65c0c}
.bigplay:active{transform:translateY(3px);box-shadow:0 1px 0 #b65c0c}
.pbar{height:5px;border-radius:3px;background:#0005;margin-top:7px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent)}

.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.tools input[type=search]{flex:1;min-width:0}
#filtPanel select{flex:1;min-width:0}
#btnFilt.on{background:var(--blue);border-color:var(--blue);color:#fff}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--bg2);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--muted)}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.chip .n{opacity:.7;margin-left:4px;font-size:11px}
.grp{margin:18px 0 8px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent2);display:flex;align-items:center;gap:10px}
.grp:after{content:"";flex:1;height:1px;background:var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px 14px}
.tape{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;background:none;border:none;padding:0;text-align:left;position:relative;display:flex;flex-direction:column;gap:7px;min-width:0}
.tape{perspective:1000px}
.case{position:relative;aspect-ratio:70/109;width:89%;margin-left:8%;container-type:inline-size;transform-style:preserve-3d;
  transform:rotateY(24deg);transform-origin:50% 50%;transition:transform .3s cubic-bezier(.2,.8,.3,1)}
.tape:hover .case,.tape:focus-visible .case{transform:rotateY(14deg) translateY(-4px)}
.tape.press .case{transform:rotateY(30deg) scale(.95);transition:transform .45s}
/* face avant : couvercle en plastique transparent */
.front{position:absolute;inset:0;border-radius:4px 5px 5px 4px;overflow:hidden;background:#0d0f15;
  box-shadow:0 18px 22px -10px #000d,6px 10px 16px -6px #0009,0 0 0 1px #ffffff14}
/* tranche (épaisseur 12 mm sur 70) : la jaquette se replie dessus */
.edge{position:absolute;top:0;bottom:0;left:0;width:17cqw;transform-origin:left center;transform:translateZ(-17cqw) rotateY(-90deg);
  border-radius:3px;overflow:hidden;background:linear-gradient(90deg,#00000055,#0000 30%,#0000 70%,#00000070),var(--lab);color:var(--labink);
  box-shadow:inset 0 0 0 1px #ffffff22}
.edge:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#ffffff30,#ffffff08 18%,transparent 40%,#00000030 100%)}
.edge span{position:absolute;inset:6% 0 18%;writing-mode:vertical-rl;transform:rotate(180deg);display:block;text-align:start;padding-top:2px;
  font:800 clamp(8px,8cqw,12px)/1 var(--ui);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.edge i{position:absolute;left:18%;right:18%;bottom:5%;height:9%;border-radius:2px;background:linear-gradient(90deg,#e94f37 0 33%,#f6ae2d 33% 66%,#33a1fd 66%)}
.peek .ph{display:flex;gap:14px;align-items:flex-start;margin-bottom:10px}
.peek .ph img,.peek .ph .cv{width:96px;aspect-ratio:2/3;object-fit:cover;border-radius:6px;flex:none;background:#333}
.peek .ph b{display:block;font-size:18px;line-height:1.2;margin-bottom:4px;text-wrap:balance}
.peek .sum{line-height:1.55;font-size:15px;max-height:34dvh;overflow:auto}
.ib.lu{background:var(--ok);border-color:var(--ok);color:#0b1d10;font-weight:700}
.jr{border-top:1px solid var(--line);padding:4px 0}
.jr>summary{cursor:pointer;font-weight:700;padding:10px 0;list-style:none;display:flex;gap:8px;align-items:center}
.jr>summary::-webkit-details-marker{display:none}
.jr>summary:after{content:"▾";margin-left:auto;color:var(--muted)}.jr:not([open])>summary:after{transform:rotate(-90deg)}
.jr .avg{font-size:12px;font-weight:700;padding:2px 7px;border-radius:6px;background:#ffd34d22;color:var(--warn)}
.crit{display:flex;flex-direction:column;gap:2px}
.cr{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cr>span{font-size:14px;user-select:none;-webkit-user-select:none}
.cr .stars button{font-size:22px;padding:0 1px}
.addrow{display:flex;gap:8px;margin:8px 0 6px}.addrow input{flex:1;min-width:0}
.nlist{display:flex;flex-direction:column;gap:6px}
.ni{display:flex;align-items:flex-start;gap:8px;background:var(--card);border-radius:9px;padding:7px 10px;font-size:14px;line-height:1.4}
.ni span{flex:1;min-width:0;overflow-wrap:anywhere}
.ni .nx{background:none;border:none;color:var(--muted);font-size:14px;padding:2px 4px}
.tape:focus-visible{outline:none}.tape:focus-visible .front{outline:2px solid var(--accent);outline-offset:2px}
/* jaquette */
.jc{position:absolute;inset:0 0 0 9.5%;display:flex;flex-direction:column;background:var(--lab,#f2e8cf);color:var(--labink,#16161a)}
.jc .art{position:relative;flex:1;min-height:0;overflow:hidden;background:#222}
.jc .art img{width:100%;height:100%;object-fit:cover;display:block}
.jc .art.blank{background:
   radial-gradient(120% 70% at 50% 120%,#0000002a,transparent 60%),
   repeating-linear-gradient(0deg,#ffffff10 0 1px,transparent 1px 4px),var(--lab)}
.jc .art.blank .big{position:absolute;inset:10% 24% auto 9%;font:800 clamp(17px,5.2vw,24px)/1.05 var(--ui);letter-spacing:-.01em;
  text-wrap:balance;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;hyphens:manual;overflow-wrap:break-word}
.jc .art.blank .mini-k7{position:absolute;left:9%;right:9%;bottom:8%;height:26%;border-radius:6px;background:#00000022;
  box-shadow:inset 0 0 0 2px #0000001f}
.jc .art.blank .mini-k7:before,.jc .art.blank .mini-k7:after{content:"";position:absolute;top:28%;width:22%;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,#0000 34%,#00000040 36% 58%,#0000 60%)}
.jc .art.blank .mini-k7:before{left:16%}.jc .art.blank .mini-k7:after{right:16%}
.jc .art.blank .addcv{position:absolute;left:50%;bottom:calc(8% + 13%);transform:translate(-50%,50%);white-space:nowrap;
  font:700 12px/1 var(--ui);padding:7px 10px;border-radius:999px;background:#000b;color:#fff;border:1px solid #ffffff55}
.cpgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.cp{position:relative;padding:0;border:2px solid transparent;border-radius:8px;overflow:hidden;background:#000;aspect-ratio:2/3}
.cp img{width:100%;height:100%;object-fit:cover;display:block}
.cp span{position:absolute;left:0;right:0;bottom:0;font-size:10px;padding:3px 5px;background:#000a;color:#fff;text-align:left}
.cp.on,.cp:focus-visible{border-color:var(--accent)}
.jc .lab{padding:7px 9px 8px;background:var(--lab);color:var(--labink);border-top:3px solid #0003}
.jc .lab b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font:700 14px/1.18 var(--ui);letter-spacing:-.005em}
.jc .lab span{display:block;font:500 11.5px/1.3 var(--ui);opacity:.78;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.jc .stripes{height:4px;background:linear-gradient(90deg,#e94f37 0 33%,#f6ae2d 33% 66%,#33a1fd 66%)}
/* tranche (charnière) */
.spine{position:absolute;inset:0 auto 0 0;width:9.5%;background:linear-gradient(90deg,#3a3f4c,#1b1e26 70%,#0c0d12);
  box-shadow:inset -1px 0 0 #ffffff22}
.spine:before{content:"";position:absolute;inset:6% 30%;background:repeating-linear-gradient(0deg,#ffffff1c 0 2px,transparent 2px 6px);border-radius:2px}
/* plastique : reflets */
.front:after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;z-index:2;
  background:linear-gradient(104deg,#ffffff00 0%,#ffffff2e 7%,#ffffff08 16%,transparent 17% 58%,#ffffff12 64%,transparent 74%),
             radial-gradient(120% 50% at 70% -10%,#ffffff22,transparent 60%),
             linear-gradient(0deg,#00000030,transparent 18%);
  box-shadow:inset 0 0 0 1px #ffffff38,inset 0 0 0 3px #ffffff0d,inset 0 2px 0 #ffffff40,inset 0 -2px 0 #00000055,inset -3px 0 6px #00000040}
/* reliefs moulés du couvercle */
.front:before{content:"";position:absolute;left:9.5%;right:0;top:0;height:3.2%;z-index:2;pointer-events:none;
  background:linear-gradient(#ffffff26,#ffffff05);border-bottom:1px solid #00000040}
.case .prog{position:absolute;left:9.5%;right:0;bottom:0;height:4px;background:#0006;z-index:2}
.case .prog i{display:block;height:100%;background:var(--accent)}
.case .done{position:absolute;top:9px;z-index:3;left:calc(9.5% + 7px);z-index:2;font:800 10px/1 var(--ui);letter-spacing:.08em;padding:4px 6px;border-radius:4px;background:var(--ok);color:#0b1d10}
.case .fav{position:absolute;top:30px;left:calc(9.5% + 7px);z-index:2;color:#ffd34d;font-size:16px;text-shadow:0 1px 2px #000}
.tape .meta{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:6px;min-width:0}
.tape .meta b{color:var(--ink);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.st{font-size:10.5px;padding:2px 7px;border-radius:6px;background:#ffffff0d;white-space:nowrap}
.empty{text-align:center;color:var(--muted);padding:50px 10px;line-height:1.6}
.empty .ib{margin:6px}

/* mini lecteur */
.mini{position:fixed;left:0;right:0;bottom:0;z-index:25;display:flex;align-items:center;gap:10px;padding:9px 14px;padding-bottom:max(9px,env(safe-area-inset-bottom));
  background:rgba(28,31,43,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);cursor:pointer}
.mini .cv{width:42px;height:42px;border-radius:7px;background:#333 center/cover;flex:none}
.mini .t{flex:1;min-width:0;font-size:13px}
.mini .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .t span{color:var(--muted)}
.mini button{border:none;background:var(--accent);color:#1a1006;width:42px;height:42px;border-radius:50%;font-size:17px;flex:none}

/* ---------- baladeur ---------- */
#deck{max-width:470px;margin:0 auto;padding:12px 14px 40px}
.wm{position:relative;border-radius:26px 26px 30px 30px;padding:16px 16px 18px;background:var(--wm-bg);
  box-shadow:inset 0 2px 0 #fff9,inset 0 -3px 0 #0003,0 22px 40px #000a,0 2px 0 var(--wm-edge);color:var(--wm-ink)}
.keys{display:grid;grid-template-columns:.8fr 1fr 1fr 1.3fr 1fr 1fr;gap:6px;margin:-34px 6px 14px;position:relative;z-index:2}
.key{height:48px;border:none;border-radius:8px 8px 4px 4px;font-size:16px;color:var(--key-ink);
  background:var(--key-bg);box-shadow:inset 0 2px 0 #ffffff30,0 6px 0 var(--key-edge),0 8px 10px #0006;transition:transform .06s,box-shadow .06s}
.key small{display:block;font-size:8px;letter-spacing:.1em;opacity:.7;margin-top:1px}
.key:active,.key.down{transform:translateY(5px);box-shadow:inset 0 2px 0 #ffffff20,0 1px 0 var(--key-edge),0 2px 4px #0006}
.key.play{background:var(--play-bg);color:var(--play-ink,#2a1300);box-shadow:inset 0 2px 0 #fff6,0 6px 0 var(--play-edge),0 8px 10px #0006}
.key.play:active,.key.play.down{box-shadow:inset 0 2px 0 #fff4,0 1px 0 var(--play-edge)}
.brand{display:flex;justify-content:space-between;align-items:flex-end;font-size:10px;letter-spacing:.2em;font-weight:800;margin:0 4px 8px}
.brand b{font-size:15px;letter-spacing:.12em}
.brand em{font-style:normal;color:var(--acc)}
.win{position:relative;border-radius:16px;padding:10px;background:linear-gradient(#20242e,#0f1117);box-shadow:inset 0 3px 10px #000c,0 1px 0 #fff8}
.win:after{content:"";position:absolute;inset:0;border-radius:16px;pointer-events:none;
  background:linear-gradient(115deg,#ffffff1c 0%,transparent 35%,transparent 70%,#ffffff0c 100%)}
.win svg{display:block;width:100%;height:auto}
.win{cursor:pointer}.win.tap{animation:tap .18s}
@keyframes tap{50%{transform:scale(.985)}}
.win svg.ins{animation:insert .55s cubic-bezier(.2,.9,.25,1.15)}
@keyframes insert{from{transform:translateY(-38%) scale(.94);opacity:0}60%{opacity:1}}
@media(prefers-reduced-motion:reduce){.win svg.ins{animation:none}}
.lcd{position:relative;overflow:hidden;margin:14px 2px 0;border-radius:10px;padding:9px 13px 8px;
  background:radial-gradient(130% 120% at 50% 0%,#0b1a10 0%,var(--lcd) 70%);color:var(--lcdink);
  box-shadow:inset 0 3px 10px #000,inset 0 0 0 1px #0f2a18,0 1px 0 #fff8;font-family:var(--lcdf);font-size:21px;line-height:1.08;
  text-shadow:0 0 6px var(--lcdglow),0 0 1px var(--lcdink)}
.lcd:after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,#00000038 0 1px,transparent 1px 3px),linear-gradient(115deg,#ffffff0d,transparent 40%)}
.lcd .row{display:flex;justify-content:space-between;gap:8px;white-space:nowrap}
.lcd .ch{overflow:hidden;text-overflow:ellipsis;max-width:70%}
.lcd .dim{color:var(--lcddim);text-shadow:none}
.seek{position:relative;height:22px;margin-top:6px;cursor:pointer;touch-action:none}
.seek .tr{position:absolute;left:0;right:0;top:9px;height:5px;border-radius:1px;
  background:repeating-linear-gradient(90deg,#0f3a1f 0 6px,#071a0e 6px 8px)}
.seek .fl{position:absolute;left:0;top:9px;height:5px;border-radius:1px;
  background:repeating-linear-gradient(90deg,var(--lcdink) 0 6px,#16702f 6px 8px);box-shadow:0 0 8px var(--lcdglow)}
.seek .tk{position:absolute;top:6px;width:2px;height:11px;background:var(--lcddim)}
.seek .kn{position:absolute;top:3px;width:6px;height:17px;margin-left:-3px;background:var(--lcdink);border-radius:1px;box-shadow:0 0 8px var(--lcdink)}
.panel{display:flex;align-items:center;gap:12px;margin:14px 4px 0}
.dial{flex:1}
.dial label{display:flex;justify-content:space-between;font-size:10px;font-weight:800;letter-spacing:.16em;margin-bottom:4px}
.dial input[type=range]{width:100%;padding:0;border:none;background:none;accent-color:var(--acc);height:22px}
.counter{display:flex;gap:2px;padding:4px;border-radius:6px;background:#1b1f28;box-shadow:inset 0 2px 4px #000}
.counter span{width:15px;height:24px;border-radius:2px;background:linear-gradient(#f4f4f4,#cfcfcf 50%,#f0f0f0);color:#111;font-family:var(--lcdf);font-size:22px;line-height:24px;text-align:center}
.minis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 2px 0}
.mk{border:none;border-radius:10px;padding:8px 2px 6px;font-size:18px;background:var(--mk-bg);color:var(--mk-ink,#2a303d);box-shadow:inset 0 1px 0 #fff,0 3px 0 var(--mk-edge)}
.mk small{display:block;font-size:9px;font-weight:800;letter-spacing:.08em;margin-top:3px}
.mk:active{transform:translateY(2px);box-shadow:0 1px 0 var(--mk-edge)}
.mk.on{background:linear-gradient(#ffb469,#ff8a1f)}
.grill{height:14px;margin:16px 30% 0;border-radius:7px;background:radial-gradient(circle,var(--grill) 1.4px,transparent 1.8px) 0 0/7px 7px}
.decktop{display:flex;align-items:center;gap:10px;margin:2px 0 48px}
.decktop .t{flex:1;min-width:0}
.decktop .t b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.decktop .t span{color:var(--muted);font-size:13px}

/* ---------- feuilles (sheets) ---------- */
.veil{position:fixed;inset:0;z-index:50;background:#0009;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:88dvh;overflow:auto;background:var(--bg2);border:1px solid var(--line);border-bottom:none;
  border-radius:20px 20px 0 0;padding:16px 16px max(18px,env(safe-area-inset-bottom));animation:up .18s ease-out}
@media(min-width:700px){.veil{align-items:center}.sheet{border-radius:20px;border-bottom:1px solid var(--line)}}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
.sheet h3{margin:0 0 12px;font-size:18px;display:flex;align-items:center;gap:8px}
.sheet h3 .x{margin-left:auto;background:none;border:none;font-size:22px;color:var(--muted)}
.fld{display:block;margin-bottom:11px}
.fld>span{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.fld input,.fld select{width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

<script>
"use strict";
/* ================================================================
   Outils
   ================================================================ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const natkey = s => String(s).toLowerCase().split(/(\d+)/).map(t => /^\d+$/.test(t) ? t.padStart(12, "0") : t).join("");
const natcmp = (a, b) => natkey(a) < natkey(b) ? -1 : natkey(a) > natkey(b) ? 1 : 0;
function fmt(s, forceH){ s = Math.max(0, Math.floor(s || 0)); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60;
  return (h || forceH) ? `${h}:${String(m).padStart(2,"0")}:${String(x).padStart(2,"0")}` : `${m}:${String(x).padStart(2,"0")}`; }
function fmtLong(s){ s = Math.round(s||0); const h = Math.floor(s/3600), m = Math.round(s%3600/60); return h ? `${h} h ${String(m).padStart(2,"0")}` : `${m} min`; }
function toast(msg, ms=2600){ const t = document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), ms); }
function hashCol(id){ let h=0; for (const c of id) h = (h*31 + c.charCodeAt(0))|0; return LABELS[Math.abs(h)%LABELS.length][0]; }
const AUDIO_RE = /\.(mp3|m4a|m4b|ogg|oga|opus|flac|wav|aac|webm|mka)$/i;
const IMG_RE = /\.(jpe?g|png|webp)$/i;
const LABELS = [["#f2e8cf","Crème"],["#e94f37","Rouge"],["#f6ae2d","Moutarde"],["#33a1fd","Bleu"],["#7bc950","Vert"],
  ["#c879ff","Violet"],["#ff7eb6","Rose"],["#2b2f3a","Chrome noir"],["#f4f4f4","Blanc"],["#ff8a1f","Orange"]];
const STATUS = {"a-lire":"À écouter","en-cours":"En cours","termine":"Terminé","abandon":"Abandonné"};
const STATUS_COL = {"a-lire":"#9099b0","en-cours":"#ff8a1f","termine":"#5ec27a","abandon":"#e2574c"};
const darkLabel = c => { const n = parseInt(c.slice(1),16); return ((n>>16)*.299 + ((n>>8)&255)*.587 + (n&255)*.114) < 120; };

/* ================================================================
   Stockage : deux moteurs (serveur Titine / local IndexedDB Pixel)
   ================================================================ */
const IDB = {
  db: null,
  open(){ return new Promise((res, rej) => { const r = indexedDB.open("k7", 2);
    r.onupgradeneeded = () => { for (const n of ["books","files","covers","kv","info"]) if (!r.result.objectStoreNames.contains(n)) r.result.createObjectStore(n); };
    r.onsuccess = () => { this.db = r.result; res(); }; r.onerror = () => rej(r.error); }); },
  req(store, mode, fn){ return new Promise((res, rej) => { const t = this.db.transaction(store, mode); let out;
    const r = fn(t.objectStore(store)); if (r) r.onsuccess = () => out = r.result;
    t.oncomplete = () => res(out); t.onerror = t.onabort = () => rej(t.error); }); },
  get(s,k){ return this.req(s,"readonly",o=>o.get(k)); },
  put(s,k,v){ return this.req(s,"readwrite",o=>o.put(v,k)); },
  del(s,k){ return this.req(s,"readwrite",o=>o.delete(k)); },
  all(s){ return this.req(s,"readonly",o=>o.getAll()); },
};

let STATE = {books:{}, settings:{}};
let BOOKS = [];
let BE = null;

const LocalBE = {
  mode: "local", urls: {},
  async load(){ await IDB.open(); STATE = (await IDB.get("kv","state")) || {books:{}, settings:{}};
    STATE.books ||= {}; STATE.settings ||= {};
    BOOKS = ((await IDB.all("books")) || []).map(b => ({...b, src:"local"})); },
  _t: null,
  persist(now){ clearTimeout(this._t); const w = () => IDB.put("kv","state",STATE).catch(e => toast("Erreur de sauvegarde : "+e));
    if (now) w(); else this._t = setTimeout(w, 400); },
  async audioSrc(b, i){ if (b.uris) return `k7:${b.id}#${i}`; const f = await IDB.get("files", `${b.id}/${i}`); if (!f) throw new Error("Fichier absent");
    if (this.urls.audio) URL.revokeObjectURL(this.urls.audio); return this.urls.audio = URL.createObjectURL(f); },
  coverCache: {},
  coverSrc(b){ return (b.has_cover && this.coverCache[b.id]) || b.cover_url || null; },
  async warmCovers(){ for (const b of BOOKS) if (b.has_cover && !this.coverCache[b.id]) {
      const c = await IDB.get("covers", b.id); if (c) this.coverCache[b.id] = URL.createObjectURL(c); } },
  saveBook(){ this.persist(); },
  saveSettings(){ this.persist(); },
  reportDuration(b, i, d){ b.durations[i] = d; b.duration = b.durations.reduce((a,x)=>a+x,0);
    if (b.chapters.length === b.files.length) b.chapters[i].end = d; this.saveMeta(b); },

    for (const [k, v] of Object.entries(g)) if (v.audio.length > 1 && v.audio.every(f => /\.m4b$/i.test(f.name))) { delete g[k];
      for (const f of v.audio) g[k + "/" + f.name] = {name: f.name.replace(/\.[^.]+$/,""), parent: v.name, path: k + "/" + f.name, audio: [f], images: v.images}; }
    const known = new Set(BOOKS.map(b => b.rel));
    const out = Object.values(g); const fresh = out.filter(x => !known.has(x.path));
    if (out.length !== fresh.length && !quiet) toast(`${out.length - fresh.length} livre(s) déjà sur l'étagère, ignorés`);
    return fresh;
  }
  if (audio.length > 1 && audio.every(f => /\.m4b$/i.test(f.name)))
    return audio.map(f => ({name: f.name.replace(/\.[^.]+$/,""), audio:[f], images:[]}));
  return [{name: audio.length === 1 ? audio[0].name.replace(/\.[^.]+$/,"") : "", audio, images}];
}

let AC = null, hissNode = null, hissGain = null, NOISE = null, motor = null;

function nb(t, dur, f, q, g, type = "bandpass"){ const c = ac(), n = c.createBufferSource(), bp = c.createBiquadFilter(), gg = c.createGain();

let tape = null;

  const n = c.createBufferSource(); n.buffer = noiseBuf(); n.loop = true;

  const of = c.createBiquadFilter(); of.type = "bandpass"; of.frequency.value = 1300; of.Q.value = 3; o.connect(of).connect(og).connect(out);

  const jit = setInterval(() => { const tt = c.currentTime, k = dir > 0 ? 1 : .8;
    o.frequency.setTargetAtTime((300 + Math.random() * 900) * k, tt, .025); bp.frequency.setTargetAtTime((900 + Math.random() * 2200) * k, tt, .03);
    og.gain.setTargetAtTime(.08 + Math.random() * .25, tt, .02); }, 55);

function hiss(on){

  else { ac();
    if (!hissNode) { hissNode = AC.createBufferSource(); hissNode.buffer = noiseBuf(); hissNode.loop = true;

      hissGain = AC.createGain(); hissGain.gain.value = 0; hissNode.connect(hp).connect(hissGain).connect(AC.destination); hissNode.start(); }

  if (!on || !S().motor) { if (motor) motor.g.gain.setTargetAtTime(0, (AC || ac()).currentTime, .15); }

    if (!motor) { const o = AC.createOscillator(), o2 = AC.createOscillator(), lf = AC.createOscillator(), lg = AC.createGain(), g = AC.createGain(), lp = AC.createBiquadFilter();

/* ================================================================
   Lecteur
   ================================================================ */
const mkAudio = () => { if (NATIVE) try { return new NativeAudio(); } catch(e) { NATIVE = false; k7diag("Lecteur Android : " + e.message); } return new Audio(); };
const player = { audio: mkAudio(), book: null, file: 0, cue: 0, lastPause: 0, sleep: null, angL: 0, angR: 0, loading: false, wantPlay: false };
const A = player.audio; A.preload = "auto";
if ("preservesPitch" in A) A.preservesPitch = true;

const fileOffset = (b, i) => { let s = 0; for (let k=0;k<i;k++) s += b.durations[k]||0; return s; };
const gpos = () => player.book ? fileOffset(player.book, player.file) + (A.currentTime || 0) : 0;
function curChapter(){ const b = player.book; if (!b) return -1; const t = A.currentTime; let idx = 0;
  b.chapters.forEach((c, k) => { if (c.file < player.file || (c.file === player.file && c.start <= t + 0.25)) idx = k; }); return idx; }
const chapStartG = c => fileOffset(player.book, c.file) + c.start;
const chapEndG = (c, k) => { const n = player.book.chapters[k+1]; return n && n.file === c.file ? fileOffset(player.book, c.file) + n.start : fileOffset(player.book, c.file) + (player.book.durations[c.file] || c.end || 0); };

async function openBook(b, autoplay){
  if (player.book) savePos();
  player.book = b; showDeck(); drawDeckStatic();
  const p = bs(b.id).pos || {file:0, t:0};
  await loadFile(Math.min(p.file, b.files.length-1), p.t || 0, autoplay);
  mediaMeta(); renderMini();
}
async function loadFile(i, t, autoplay){
  const b = player.book; player.loading = true; player.file = i;
  try { A.src = await BE.audioSrc(b, i); } catch(e) { toast("Fichier introuvable : " + b.files[i]); player.loading = false; return; }
  A.playbackRate = (S().speedPerBook && bs(b.id).speed) || S().speed || 1; A.defaultPlaybackRate = A.playbackRate;
  await new Promise(res => { const ok = () => { A.removeEventListener("loadedmetadata", ok); res(); }; A.addEventListener("loadedmetadata", ok); A.addEventListener("error", ok, {once:true}); });
  if (isFinite(A.duration) && A.duration > 0 && Math.abs((b.durations[i]||0) - A.duration) > 1.5 && !(b.durations[i] > 0)) {
    b.durations[i] = A.duration; b.duration = bDur(b); BE.reportDuration(b, i, A.duration); }
  try { A.currentTime = Math.max(0, Math.min(t, (A.duration || t+1) - 0.5)); } catch {}
  player.loading = false; drawTicks(); updateUI();
  if (autoplay || player.wantPlay) play(true);
}
async function play(noRewind){
  if (!player.book) return; ac(); player.wantPlay = true;
  if (!noRewind && player.lastPause) { const gap = (Date.now() - player.lastPause)/1000; const rw = S().rewind ?? 5;
    if (gap > 8 && rw) seekG(gpos() - (gap > 1800 ? rw*3 : rw), true); }
  try { await A.play(); } catch(e) { if (e.name !== "AbortError") toast("Lecture impossible : " + e.message); }
  if (bStatus(player.book) === "a-lire" || bStatus(player.book) === "termine") setBook(player.book.id, {status:"en-cours"});
}
function pause(){ player.wantPlay = false; A.pause(); player.lastPause = Date.now(); savePos(true); }
function toggle(){ A.paused ? play() : pause(); }
async function seekG(sec, keepState){
  const b = player.book; if (!b) return; const total = bDur(b); sec = Math.max(0, total ? Math.min(sec, total - 0.5) : sec);
  let i = 0, acc = 0; while (i < b.files.length-1 && acc + (b.durations[i]||0) <= sec) { acc += b.durations[i]||0; i++; }
  const t = sec - acc;
  if (i === player.file) { A.currentTime = Math.max(0, t); updateUI(); }
  else { const was = !A.paused; await loadFile(i, t, was); }
  if (!keepState) savePos();
}
const skip = d => seekG(gpos() + d);
function chapterJump(dir){
  const b = player.book; if (!b) return; const k = curChapter(); const c = b.chapters[k];
  if (dir < 0) { if (gpos() - chapStartG(c) > 4 || k === 0) seekG(chapStartG(c)); else seekG(chapStartG(b.chapters[k-1])); }
  else if (b.chapters[k+1]) seekG(chapStartG(b.chapters[k+1]));
}
if (NATIVE) A.addEventListener("k7advance", e => { if (!player.book) return; player.file = e.detail; drawTicks(); updateUI(); savePos(); });
A.addEventListener("ended", async () => {
  const b = player.book; if (NATIVE) player.file = b.files.length - 1;
  if (player.file < b.files.length - 1) { await loadFile(player.file + 1, 0, true); }
  else { player.wantPlay = false; setBook(b.id, {status:"termine", pos:{file:0, t:0}, done: Date.now()}); clunk(true); toast("🎉 Livre terminé — rangé dans « Terminés »"); updateUI(); }
});
A.addEventListener("play", () => { updateUI(); hiss(true); });
A.addEventListener("pause", () => { updateUI(); hiss(false); });
A.addEventListener("ratechange", updateUI);
let lastSave = 0;
A.addEventListener("timeupdate", () => { if (Date.now() - lastSave > 5000 && !A.paused) savePos(); checkSleep(); });
function savePos(now){ if (!player.book || player.loading) return; lastSave = Date.now();
  const pos = {file: player.file, t: Math.round(A.currentTime*10)/10}, last = Date.now();
  try { localStorage.setItem("k7pos", JSON.stringify({id: player.book.id, pos, last})); } catch {}
  setBook(player.book.id, {pos, last}); if (now === true) BE.persist(true); }
document.addEventListener("visibilitychange", () => { if (document.hidden) savePos(true); });
window.addEventListener("pagehide", () => savePos(true));
window.addEventListener("freeze", () => savePos(true));
// lecture coupée par une erreur (fichier, décodage, Android) : on recharge au bon endroit et on relance, 3 essais max
let retries = 0;
A.addEventListener("error", () => { if (!player.book || player.loading || !player.wantPlay || retries >= 3) return; retries++;
  const p = bs(player.book.id).pos || {file: player.file, t: 0};
  setTimeout(() => loadFile(player.file, p.file === player.file ? p.t : 0, true), 800 * retries); });
A.addEventListener("playing", () => { retries = 0; });

/* --- maintien FF / REW = défilement rapide --- */
let holdT = null, cueT = null;
function keyDown(k, el){
  el.classList.add("down"); sfx("press"); vib(8);
  if (k === "ff" || k === "rew") { holdT = setTimeout(() => { player.cue = k === "ff" ? 1 : -1; el.dataset.held = 1; sfx(k); tapeStart(player.cue);
      cueT = setInterval(() => skip(player.cue * 4), 120); }, 380); }
}
function keyUp(k, el){
  el.classList.remove("down"); clearTimeout(holdT);
  if (cueT) { clearInterval(cueT); cueT = null; player.cue = 0; delete el.dataset.held; tapeStop(); sfx("press"); savePos(); return; }
  if (k === "play") { sfx(A.paused ? "play" : "stop"); toggle(); }
  else if (k === "stop") { sfx("stop"); pause(); }
  else if (k === "ff") { sfx("ff"); tapeBurst(1); skip(S().fwd || 30); }
  else if (k === "rew") { sfx("rew"); tapeBurst(-1); skip(-(S().back || 15)); }
  else if (k === "prevch") { tapeBurst(-1, 520); chapterJump(-1); }
  else if (k === "nextch") { tapeBurst(1, 520); chapterJump(1); }
}
const vib = ms => { if (S().vibrate !== false) try { navigator.vibrate?.(ms); } catch {} };
document.querySelectorAll(".key").forEach(el => {
  const k = el.dataset.k;
  el.addEventListener("pointerdown", e => { e.preventDefault(); el.setPointerCapture(e.pointerId); keyDown(k, el); });
  el.addEventListener("pointerup", () => keyUp(k, el));
  el.addEventListener("pointercancel", () => { el.classList.remove("down"); clearTimeout(holdT); if (cueT) { clearInterval(cueT); cueT = null; player.cue = 0; tapeStop(); } });
});
$("#winCass").onclick = () => { if (!player.book || S().tapCass === false) return; sfx(A.paused ? "play" : "stop"); vib(10); toggle(); const w = $("#winCass"); w.classList.remove("tap"); void w.offsetWidth; w.classList.add("tap"); };
$("#miniPlay").onclick = e => { e.stopPropagation(); clunk(); toggle(); };
$("#mini").onclick = showDeck;

/* vitesse / volume */
$("#spd").oninput = e => { const v = +e.target.value; A.playbackRate = v; A.defaultPlaybackRate = v; if (S().speedPerBook && player.book) setBook(player.book.id, {speed: v}); else setSetting({speed: v}); updateUI(); };
$("#spd").ondblclick = () => { $("#spd").value = 1; $("#spd").oninput({target:$("#spd")}); };
$("#vol").oninput = e => { A.volume = +e.target.value; setSetting({vol: A.volume}); $("#volV").textContent = Math.round(A.volume*10); hiss(!A.paused); };

/* barre de position (sur tout le livre, repères de chapitres) */
function seekFromEvent(e){ const r = $("#seek").getBoundingClientRect(); const x = Math.min(1, Math.max(0, (e.clientX - r.left)/r.width)); return x * bDur(player.book); }
$("#seek").addEventListener("pointerdown", e => { if (!player.book) return; $("#seek").setPointerCapture(e.pointerId); player.drag = seekFromEvent(e); updateUI(); });
$("#seek").addEventListener("pointermove", e => { if (player.drag != null) { player.drag = seekFromEvent(e); updateUI(); } });
$("#seek").addEventListener("pointerup", () => { if (player.drag != null) { const s = player.drag; tapeBurst(s > gpos() ? 1 : -1, 420); player.drag = null; seekG(s); } });
function drawTicks(){ const b = player.book; const d = bDur(b); if (!d) { $("#ticks").innerHTML = ""; return; }
  $("#ticks").innerHTML = b.chapters.length > 1 && b.chapters.length < 300 ? b.chapters.slice(1).map(c => `<div class="tk" style="left:${chapStartG(c)/d*100}%"></div>`).join("") : ""; }

/* ---------- affichage ---------- */
function drawDeckStatic(){
  const b = player.book;
  $("#dTitle").textContent = bTitle(b); $("#dAuthor").textContent = bAuthor(b) + (bNarr(b) ? " · lu par " + bNarr(b) : "");
  const cs = $("#cass"); if (player.drawn !== b.id) { player.drawn = b.id; cs.classList.remove("ins"); void cs.getBoundingClientRect(); cs.classList.add("ins"); if (AC) sfx("eject"); }
  $("#cass").innerHTML = cassetteSVG({title: bTitle(b), author: bAuthor(b), color: bColor(b), p: bProg(b), cover: coverOf(b), big: true, side: bs(b.id).fav ? "★" : "A"});
  $("#spd").value = (S().speedPerBook && bs(b.id).speed) || S().speed || 1; $("#vol").value = S().vol ?? 1; A.volume = S().vol ?? 1; $("#volV").textContent = Math.round(A.volume*10);
  $("#lblRew").textContent = "-" + (S().back || 15); $("#lblFf").textContent = "+" + (S().fwd || 30);
}
function updateUI(){
  const b = player.book; if (!b) return;
  const total = bDur(b), pos = player.drag ?? gpos(), p = total ? pos/total : 0;
  const k = curChapter(), c = b.chapters[k];
  $("#lChap").textContent = c ? `${k+1}/${b.chapters.length} ${c.title}` : "—";
  if (c) { const cs = chapStartG(c), ce = chapEndG(c, k); $("#lChapT").textContent = `${fmt(pos - cs)} / ${fmt(ce - cs)}`; }
  $("#lPos").textContent = fmt(pos, true); $("#lPct").textContent = Math.floor(p*100) + "%";
  const rate = A.playbackRate || 1;
  $("#lLeft").textContent = "-" + fmt((total - pos) / rate, true);
  $("#lSpeed").textContent = "×" + rate.toFixed(2); $("#spdV").textContent = rate.toFixed(2);
  $("#lState").textContent = player.cue > 0 ? "▶▶ FF" : player.cue < 0 ? "◀◀ REW" : A.paused ? "PAUSE" : "▶ PLAY";
  $("#seekFl").style.width = (p*100) + "%"; $("#seekKn").style.left = (p*100) + "%";
  const ct = Math.floor(pos / 10) % 1000; [...$("#counter").children].forEach((s, i) => s.textContent = String(ct).padStart(3,"0")[i]);
  document.querySelector('.key.play').innerHTML = (A.paused ? "▶" : "❚❚") + `<small>${A.paused ? "PLAY" : "PAUSE"}</small>`;
  const [rl, rr] = packR(p); const pl = $("#packL"), pr = $("#packR");
  if (pl) { pl.setAttribute("r", rl); pr.setAttribute("r", rr); $("#shL")?.setAttribute("r", rl); $("#shR")?.setAttribute("r", rr);
    for (const [k, r] of [["L", rl], ["R", rr]]) { $("#seam" + k)?.setAttribute("x2", r - 1); const d = $("#dash" + k); if (d) { d.setAttribute("r", (r + 15) / 2); d.setAttribute("stroke-width", Math.max(1, r - 16)); } } $("#tapePath")?.setAttribute("d", `M${150-rl+2} 170 L120 236 H280 L${250+rr-2} 170`); }
  renderMini();
  if ("mediaSession" in navigator && isFinite(A.duration) && A.duration > 0) {
    try { navigator.mediaSession.setPositionState({duration: A.duration, playbackRate: rate, position: Math.min(A.currentTime, A.duration)}); } catch {} }
}
// bobines : vitesse angulaire = vitesse de bande / rayon (la petite bobine tourne plus vite, comme en vrai)
let lastF = performance.now();
function spin(now){
  const dt = Math.min(.1, (now - lastF)/1000); lastF = now;
  if (player.book && !$("#deck").classList.contains("hide")) {
    const moving = player.cue ? player.cue * 9 : (!A.paused ? (A.playbackRate || 1) : 0);
    if (moving) { const v = 46 * moving; const p = bDur(player.book) ? gpos()/bDur(player.book) : 0; const [rl, rr] = packR(p);
      player.angL += v / rl * dt * 57.3; player.angR += v / rr * dt * 57.3;
      $("#hubL")?.setAttribute("transform", `rotate(${player.angL % 360})`); $("#hubR")?.setAttribute("transform", `rotate(${player.angR % 360})`);
      if ((now|0) % 4 === 0) updateUI(); }
  }
  requestAnimationFrame(spin);
}
requestAnimationFrame(spin);
setInterval(() => { if (player.book && !A.paused) updateUI(); }, 500);

function renderMini(){
  const b = player.book; const m = $("#mini");
  if (!b || !$("#deck").classList.contains("hide")) { m.classList.add("hide"); return; }
  m.classList.remove("hide"); const cv = coverOf(b);
  $("#miniCv").style.cssText = cv ? `background-image:url('${cv}')` : `background:${bColor(b)}`;
  $("#miniT").textContent = bTitle(b); $("#miniS").textContent = `${fmt(gpos(), true)} · reste ${fmtLong((bDur(b) - gpos())/(A.playbackRate||1))}`;
  $("#miniPlay").textContent = A.paused ? "▶" : "❚❚";
}
function showDeck(){ if (!player.book) return; $("#lib").classList.add("hide"); $("#deck").classList.remove("hide"); setTimeout(keepAwake, 0); renderMini(); drawDeckStatic(); updateUI(); window.scrollTo(0,0); }
function showLib(){ $("#deck").classList.add("hide"); setTimeout(keepAwake, 0); $("#lib").classList.remove("hide"); render(); renderMini(); }

/* ---------- Media Session (écran verrouillé, casque, touches média) ---------- */
function mediaMeta(){
  if (!("mediaSession" in navigator) || !player.book) return; const b = player.book; const cv = coverOf(b);
  navigator.mediaSession.metadata = new MediaMetadata({title: bTitle(b), artist: bAuthor(b), album: "K7",
    artwork: cv ? [{src: new URL(cv, location.href).href, sizes: "512x512"}] : [{src: "icon-512.png", sizes: "512x512", type: "image/png"}]});
  const h = { play: () => play(), pause: () => pause(), stop: () => pause(),
    seekbackward: () => skip(-(S().back||15)), seekforward: () => skip(S().fwd||30),
    previoustrack: () => chapterJump(-1), nexttrack: () => chapterJump(1),
    seekto: d => { A.currentTime = d.seekTime; savePos(); } };
  for (const [k, f] of Object.entries(h)) { try { navigator.mediaSession.setActionHandler(k, f); } catch {} }
}
document.addEventListener("keydown", e => {
  if (e.target.matches("input,select,textarea") || !player.book) return;
  if (e.code === "Space") { e.preventDefault(); clunk(); toggle(); }
  else if (e.key === "ArrowLeft") skip(e.shiftKey ? -60 : -(S().back||15));
  else if (e.key === "ArrowRight") skip(e.shiftKey ? 60 : (S().fwd||30));
  else if (e.key === "PageUp") chapterJump(-1);
  else if (e.key === "PageDown") chapterJump(1);
  else if (e.key === "b") addMark();
  else if (e.key === "Escape") { if (!$("#veil").classList.contains("hide")) closeSheet(); else showLib(); }
});

/* ---------- minuterie de sommeil ---------- */
function checkSleep(){
  const s = player.sleep; if (!s || A.paused) return;
  let left = s.mode === "min" ? (s.end - Date.now())/1000 : (chapEndG(player.book.chapters[s.chap], s.chap) - gpos()) / (A.playbackRate||1);
  if (s.mode === "chap" && curChapter() !== s.chap) left = 0;
  $("#lSleep").textContent = "☾ " + fmt(Math.max(0,left));
  const vol = S().vol ?? 1;
  if (left < 8 && left > 0) A.volume = vol * left/8;
  if (left <= 0) { pause(); A.volume = vol; player.sleep = null; $("#lSleep").textContent = ""; $("#mSleep").classList.remove("on"); clunk(true); }
}
setInterval(checkSleep, 1000);
$("#mSleep").onclick = () => {
  const opts = [[0,"Arrêt"],[5,"5 min"],[10,"10 min"],[15,"15 min"],[20,"20 min"],[30,"30 min"],[45,"45 min"],[60,"1 h"],[90,"1 h 30"],["chap","Fin du chapitre"]];
  openSheet(`<h3>☾ Minuterie de sommeil <button class="x" data-close>×</button></h3><div class="seg">${opts.map(([v,l]) => `<button data-sl="${v}">${l}</button>`).join("")}</div>
   <p class="note">Le son baisse doucement sur les dernières secondes, puis la lecture s'arrête. Le recul auto à la reprise te remet là où tu as décroché.</p>`);
  document.querySelectorAll("[data-sl]").forEach(x => x.onclick = () => { const v = x.dataset.sl;
    if (v === "0") { player.sleep = null; $("#lSleep").textContent = ""; A.volume = S().vol ?? 1; }
    else if (v === "chap") player.sleep = {mode:"chap", chap: curChapter()};
    else player.sleep = {mode:"min", end: Date.now() + v*60000};
    $("#mSleep").classList.toggle("on", !!player.sleep); closeSheet(); if (player.sleep && A.paused) play(); });
};

    `<button class="li ${k===cur?"cur":""}" data-ch="${k}"><span class="n">${String(k+1).padStart(2,"0")}</span><span class="tt"><b>${esc(c.title)}</b><span>${fmt(chapStartG(c), true)}</span></span><span class="d">${fmt(chapEndG(c,k)-chapStartG(c))}</span></button>`).join("")}</div>`);

/* ---------- signets ---------- */
function addMark(){
  const b = player.book; if (!b) return; clunk();
  const m = {file: player.file, t: Math.round(A.currentTime*10)/10, g: gpos(), at: Date.now(), note: "", chap: b.chapters[curChapter()]?.title || ""};
  const marks = [...(bs(b.id).marks || []), m]; setBook(b.id, {marks});
  openSheet(`<h3>🔖 Signet à ${fmt(m.g, true)} <button class="x" data-close>×</button></h3>
    <label class="fld"><span>Note (facultatif) — une phrase, une idée, une image pour t'en souvenir</span><input id="mkNote" placeholder="ex : la scène du phare, à réécouter"></label>
    <div class="btns"><button class="ib acc" id="mkOk">Enregistrer</button></div>`);
  $("#mkNote").focus();
  const save = () => { m.note = $("#mkNote").value.trim(); setBook(b.id, {marks}); closeSheet(); toast("Signet posé"); };
  $("#mkOk").onclick = save; $("#mkNote").onkeydown = e => e.key === "Enter" && save();
}
$("#mMark").onclick = addMark;
$("#mMarks").onclick = () => {

async function getJSON(url, opt = {}, ms = 25000){
  const c = new AbortController(); const t = setTimeout(() => c.abort(), ms);
  try { const r = await fetch(url, {...opt, signal: c.signal}); if (!r.ok) { const e = new Error(`HTTP ${r.status}`); e.status = r.status; throw e; } return await r.json(); }
  catch(e) { if (e.name === "AbortError") throw new Error("délai dépassé"); throw e; }
  finally { clearTimeout(t); }
}
async function sparql(q){
  const j = await getJSON("https://query.wikidata.org/sparql?format=json&query=" + encodeURIComponent(q));

const QID = u => (u && /\/entity\/(Q\d+)$/.exec(u)) ? /\/entity\/(Q\d+)$/.exec(u)[1] : null;

function cleanTitle(t){

    .replace(/\[[^\]]*\]|\([^)]*(livre audio|audio|unabridged|int[ée]gral|lu par|narr|mp3|m4b)[^)]*\)/gi, "")
    .replace(/\b(livre audio|audiobook|unabridged|version int[ée]grale|int[ée]gral)\b/gi, "")
    .replace(/\b(tome|vol(ume)?\.?|t\.?|book|partie)\s*\d+\b/gi, "")

function authorMatches(cand, wanted){
  const w = norm(wanted).split(" ").filter(x => x.length > 2); if (!w.length) return true;
  const c = norm(cand).split(" "); const last = w[w.length - 1];
  return c.includes(last) || w.some(x => x.length > 3 && c.includes(x));
}

async function findWork(title, author){
  const unknown = !author || /inconnu/i.test(author);
  for (const lang of ["fr", "en"]) {
    for (const q of unknown ? [title] : [title, `${title} ${author}`]) {
      const rows = await sparql(`SELECT ?w ?wLabel ?wDescription ?a ?aLabel ?num WHERE {
        SERVICE wikibase:mwapi { bd:serviceParam wikibase:api "EntitySearch"; wikibase:endpoint "www.wikidata.org";
          mwapi:search "${sq(q)}"; mwapi:language "${lang}". ?w wikibase:apiOutputItem mwapi:item. ?num wikibase:apiOrdinal true. }
        ?w wdt:P50 ?a.
        SERVICE wikibase:label { bd:serviceParam wikibase:language "fr,en". } } ORDER BY ?num LIMIT 40`);
      const scored = rows.map(r => ({...r, score: (unknown || authorMatches(r.aLabel, author) ? 100 : 0) - (+r.num || 0)
        + (norm(r.wLabel) === norm(title) ? 20 : 0) - (/(édition|edition|traduction|translation)/i.test(r.wDescription || "") ? 30 : 0)}))
        .sort((a, b) => b.score - a.score);
      if (scored[0] && scored[0].score > 50) return {q: QID(scored[0].w), label: scored[0].wLabel, desc: scored[0].wDescription || "", author: scored[0].aLabel, authorQ: QID(scored[0].a)};
    }
  }
  return null;
}

/* ---------- pochettes : recherche + pose ---------- */
function jsonp(url, ms = 12000){
  return new Promise((res, rej) => { const cb = "k7cb" + Math.random().toString(36).slice(2); const sc = document.createElement("script");
    const done = v => { delete window[cb]; sc.remove(); clearTimeout(t); v instanceof Error ? rej(v) : res(v); };
    const t = setTimeout(() => done(new Error("délai dépassé")), ms);
    window[cb] = done; sc.onerror = () => done(new Error("réseau")); sc.src = url + (url.includes("?") ? "&" : "?") + "callback=" + cb; document.head.appendChild(sc); });
}
async function searchCovers(title, author){
  const t = cleanTitle(title) || title, a = /inconnu/i.test(author) ? "" : author;
  const out = [], seen = new Set();
  const add = (url, src, label, score) => { if (!url || seen.has(url)) return; seen.add(url); out.push({url, src, label, score}); };
  const match = (x, wanted) => !wanted || authorMatches(x || "", wanted);
  const titleOk = x => { const n = norm(x), q = norm(t); return n && q && (n.includes(q) || q.includes(n) || q.split(" ").filter(w => w.length > 3).every(w => n.includes(w))); };
  const jobs = [
    // iTunes / Apple Books : pochettes de livres audio, carrées, 600 px
    ...["audiobook", "ebook"].map(media => jsonp(`https://itunes.apple.com/search?term=${encodeURIComponent((t + " " + a).trim())}&media=${media}&country=FR&limit=12`).then(j =>
      (j.results || []).forEach(r => { const art = (r.artworkUrl100 || r.artworkUrl60 || "").replace(/\/\d+x\d+(bb)?\.(jpg|png)$/, "/600x600bb.jpg");
        add(art, media === "audiobook" ? "Livre audio" : "Livre", `${r.collectionName || r.trackName || ""} — ${r.artistName || ""}`,
          (titleOk(r.collectionName || r.trackName) ? 50 : 0) + (match(r.artistName, a) ? 30 : 0) + (media === "audiobook" ? 10 : 0)); })).catch(() => {})),
    // Google Livres : éditions papier françaises
    getJSON(`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(`intitle:${t}` + (a ? ` inauthor:${a}` : ""))}&maxResults=12&printType=books`).then(j =>
      (j.items || []).forEach(it => { const v = it.volumeInfo || {}; const im = v.imageLinks?.extraLarge || v.imageLinks?.large || v.imageLinks?.thumbnail;
        if (im) add(im.replace(/^http:/, "https:").replace("&edge=curl", "") + (im.includes("fife=") ? "" : "&fife=w800"), "Livre", `${v.title || ""} — ${(v.authors||[]).join(", ")}`,
          (titleOk(v.title) ? 45 : 0) + (match((v.authors||[]).join(" "), a) ? 30 : 0)); })).catch(() => {}),
    // Open Library
    getJSON(`https://openlibrary.org/search.json?title=${encodeURIComponent(t)}${a ? "&author=" + encodeURIComponent(a) : ""}&limit=8&fields=title,author_name,cover_i`).then(j =>
      (j.docs || []).forEach(d => d.cover_i && add(`https://covers.openlibrary.org/b/id/${d.cover_i}-L.jpg`, "Open Library", `${d.title || ""} — ${(d.author_name||[]).join(", ")}`,
        (titleOk(d.title) ? 40 : 0) + (match((d.author_name||[]).join(" "), a) ? 30 : 0)))).catch(() => {}),
  ];
  await Promise.all(jobs);
  return out.sort((x, y) => y.score - x.score);
}
async function setCover(b, src, chosen = false){ // src = Blob (galerie) ou URL (web)

    if (LocalBE.coverCache[b.id]) URL.revokeObjectURL(LocalBE.coverCache[b.id]); LocalBE.coverCache[b.id] = URL.createObjectURL(src);

      await IDB.del("covers", b.id); b.has_cover = false; delete LocalBE.coverCache[b.id]; b.cover_url = src;

}

/* ---------- résumés ---------- */
const titleMatch = (x, q) => { const n = norm(cleanTitle(x) || x), t = norm(cleanTitle(q) || q); if (!n || !t) return false;
  return n === t || n.startsWith(t + " ") || t.startsWith(n + " ") || (t.length > 6 && n.includes(t)) || t.split(" ").filter(w => w.length > 3).every(w => n.includes(w)); };
// retire les citations de presse en tête (« Retenez bien ce nom » Le Figaro…) pour garder l'histoire
function stripPress(t){
  let s = String(t || "").trim();
  // « citation » + signature de journal (« Le Monde », « Le Figaro littéraire », « Télérama »…), répété en tête de texte
  const attr = String.raw`(?:(?:L[ae]s?\s+|L['’]))?\p{Lu}[\p{L}'’.-]+(?:\s+(?:littéraire|magazine|Magazine|Livres|dimanche|\p{Lu}[\p{L}'’.-]+(?=\s*["«“„”»\n])))?`;
  const re = new RegExp(String.raw`^["«“„]\s*([^"»”“]{3,260}?)\s*["»”“]\s*(?:[-–—,]\s*)?(` + attr + String.raw`)?\s*(?=["«“„]|\n|\p{Lu}|$)`, "u");
  for (let k = 0; k < 5; k++) {
    const m = s.match(re); if (!m) break;
    const rest = s.slice(m[0].length).trim(); if (rest.length < 120) break;
    s = rest;
  }
  return s;
}
const htmlText = h => { try { const d = new DOMParser().parseFromString(String(h || "").replace(/<br\s*\/?>|<\/p>/gi, "\n"), "text/html"); return (d.body.textContent || "").replace(/\n{3,}/g, "\n\n").trim(); } catch { return String(h || ""); } };
async function fetchSummary(b, info){
  const t = cleanTitle(bTitle(b)) || bTitle(b), a = /inconnu/i.test(bAuthor(b)) ? "" : bAuthor(b);
  // 1. Apple Livres : texte de 4e de couverture, en français
  for (const media of ["audiobook", "ebook"]) {
    if (info.apple?.desc) break;
    try { const j = await jsonp(`https://itunes.apple.com/search?term=${encodeURIComponent((t + " " + a).trim())}&media=${media}&country=FR&limit=10`);
      const hit = (j.results || []).find(r => titleMatch(r.collectionName || r.trackName || "", t) && (!a || authorMatches(r.artistName || "", a)) && r.description);
      if (hit) info.apple = {desc: stripPress(htmlText(hit.description)), url: hit.collectionViewUrl || hit.trackViewUrl || "", src: media === "audiobook" ? "Apple Livres (livre audio)" : "Apple Livres"}; } catch {}
  }
  // 2. Wikipédia FR : article du roman (« Glacé (roman) »)
  if (!info.wiki?.extract) {
    try { const j = await getJSON(`https://fr.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent((t + " " + a).trim())}&srlimit=5&format=json&origin=*`);
      const pg = (j.query?.search || []).find(x => titleMatch(x.title.replace(/\s*\([^)]*\)\s*$/, ""), t) && !(a && norm(x.title) === norm(a)));
      if (pg) info.wiki = await wikiIntro("https://fr.wikipedia.org/wiki/" + encodeURIComponent(pg.title.replace(/ /g, "_"))); } catch {}
  }
  // 3. Google Livres (souvent limité sans clé)
  if (!info.apple?.desc && !info.wiki?.extract) {
    try { const j = await getJSON(`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(`intitle:${t}` + (a ? ` inauthor:${a}` : ""))}&maxResults=8`);
      const v = (j.items || []).map(x => x.volumeInfo || {}).find(v => v.description && titleMatch(v.title || "", t) && (!a || authorMatches((v.authors || []).join(" "), a)));
      if (v) info.gbooks = {desc: htmlText(v.description), src: "Google Livres"}; } catch {}
  }
  info.sumTried = Date.now();
  return info;
}

/* ---------- pipeline ---------- */
async function enrich(b, {force = false, log = () => {}} = {}){
  const prev = bInfo(b) || {};
  const info = {...prev, errors: []};
  const title = cleanTitle(bTitle(b)) || bTitle(b), author = bAuthor(b);
  if (force || !prev.at) {
    try { log("Wikidata"); const w = await findWork(title, author);
      if (w) { info.wd = {...await workDetails(w.q), desc: w.desc}; info.wd.label ||= w.label; info.authorQ = w.authorQ; info.authorName = w.author; }
      else { info.wd = null; info.errors.push("Œuvre introuvable sur Wikidata"); } }
    catch(e) { info.errors.push("Wikidata : " + e.message); }
    try { log("Wikipédia"); const w = info.wd?.wiki; info.wiki = await wikiIntro(w?.fr || w?.en); } catch(e) { info.errors.push("Wikipédia : " + e.message); }
    try { log("Open Library"); info.ol = await openLib(title, author); } catch(e) { info.errors.push("Open Library : " + e.message); }
    if (info.authorQ) { const k = aKey(info.authorName || author); const ex = Info.get(k);
      if (force || !ex) { try { log("Auteur"); const a = await authorDetails(info.authorQ); a.wikiIntro = await wikiIntro(a.wiki.fr || a.wiki.en).catch(() => null); a.at = Date.now(); await Info.put(k, a); }
        catch(e) { info.errors.push("Auteur : " + e.message); } }
      info.authorKey = k; }
    if (S().autoSum !== false) { log("Résumé"); await fetchSummary(b, info); }
    if (!b.has_cover && !b.cover_url) { log("Pochette"); if (!await autoCover(b)) await grabCover(b, [info.ol?.cover && `https://covers.openlibrary.org/b/id/${info.ol.cover}-L.jpg`, info.wiki?.image]); }
    info.at = Date.now();
  }
  await Info.put("b:" + b.id, info);
  return info;
}

let FILL = null;
async function fillAll(silent){
  if (FILL || !navigator.onLine) return;
  const todo = BOOKS.filter(b => !bInfo(b)?.at || !bInfo(b)?.sumTried || (!b.has_cover && !b.cover_url && !bs(b.id).coverTried));
  if (!todo.length) { if (!silent) toast("Toutes les fiches sont déjà à jour ✓"); return; }
  FILL = {stop: false}; let n = 0;
  if (!silent) { openSheet(`<h3>ⓘ Récupérer les infos <button class="x" id="fillStop">Stop</button></h3>

    $("#fillStop").onclick = () => { FILL.stop = true; }; }
  for (const b of todo) {
    if (FILL.stop || !navigator.onLine) break;
    try { if (bInfo(b)?.at) { if (!bInfo(b).sumTried) await Info.put("b:" + b.id, await fetchSummary(b, {...bInfo(b)})); await autoCover(b); n++; continue; } await enrich(b, {log: x => { const m = $("#fillMsg"); if (m) m.textContent = `${n+1}/${todo.length} · ${bTitle(b)} — ${x}`; }}); } catch {}

/* ---------- sauvegarde / restauration ---------- */
const blobToData = b => new Promise(r => { const f = new FileReader(); f.onload = () => r(f.result); f.onerror = () => r(null); f.readAsDataURL(b); });
async function exportBackup(){
  toast("Préparation de la sauvegarde…");
  const covers = {};
  for (const b of BOOKS) if (b.has_cover && bs(b.id).coverChosen) { const c = await IDB.get("covers", b.id); if (c && c.size < 1.5e6) covers[b.id] = await blobToData(c); }
  const data = {app: "K7 Baladeur", v: 1, at: new Date().toISOString(), state: STATE,
    books: BOOKS.map(({src, ...m}) => m), info: Info.map, covers};
  const blob = new Blob([JSON.stringify(data)], {type: "application/json"});
  const fname = `k7-sauvegarde-${new Date().toISOString().slice(0, 10)}.json`;
  if (NATIVE) { try { await K7P.saveDownload({name: fname, data: (await blobToData(blob)).split(",")[1]}); setSetting({lastBackup: Date.now()}); toast("Sauvegarde enregistrée dans Téléchargements"); }
    catch(e) { toast("Sauvegarde impossible : " + (e.message || e), 5000); } return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = `k7-sauvegarde-${new Date().toISOString().slice(0, 10)}.json`; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  setSetting({lastBackup: Date.now()}); toast("Sauvegarde enregistrée dans Téléchargements");
}
async function importBackup(file){
  let d; try { d = JSON.parse(await file.text()); } catch { toast("Fichier illisible"); return; }
  if (d.app !== "K7 Baladeur" || !d.state) { toast("Ce n'est pas une sauvegarde K7"); return; }
  const key = m => norm((m.rel || "") ) || norm(m.title + " " + m.author);
  const key2 = m => norm(m.title + " " + m.author);
  const mine = new Map(); for (const b of BOOKS) { mine.set("r:" + key(b), b); mine.set("t:" + key2(b), b); }
  let n = 0, miss = 0;
  for (const old of d.books || []) {
    const b = mine.get("r:" + key(old)) || mine.get("t:" + key2(old)) || BOOKS.find(x => x.id === old.id);
    if (!b) { miss++; continue; }
    const st = d.state.books?.[old.id]; if (st) STATE.books[b.id] = {...(STATE.books[b.id] || {}), ...st};
    if (old.series && !b.series) b.series = old.series; if (old.narrator && !b.narrator) b.narrator = old.narrator;
    if (!b.has_cover && old.cover_url) b.cover_url = old.cover_url;
    const inf = d.info?.["b:" + old.id]; if (inf) await Info.put("b:" + b.id, inf);
    const cv = d.covers?.[old.id]; if (cv) { const bl = await (await fetch(cv)).blob(); await IDB.put("covers", b.id, bl); b.has_cover = true; LocalBE.coverCache[b.id] = URL.createObjectURL(bl); }
    await LocalBE.saveMeta(b); n++;
  }
  for (const [k, v] of Object.entries(d.info || {})) if (k.startsWith("a:") && !Info.get(k)) await Info.put(k, v);
  STATE.settings = {...d.state.settings, ...STATE.settings, lastBackup: STATE.settings.lastBackup};
  LocalBE.persist(); render();
  toast(`${n} livre${n > 1 ? "s" : ""} restauré${n > 1 ? "s" : ""}${miss ? ` · ${miss} pas trouvé${miss > 1 ? "s" : ""} (réimporte-les puis restaure à nouveau)` : ""}`, 6000);
}

      const nt = {...(bs(b.id).notes || {})}; nt[k] = [...(nt[k] || []), {n: n.trim(), d: d.join(" — ").trim(), at: Date.now()}]; setBook(b.id, {notes: nt}); redraw();

}

(() => { // appui long (doigt) ou clic droit (souris)
  let timer = null, startX = 0, startY = 0, fired = false, el = null;
  const cancel = () => { clearTimeout(timer); timer = null; el?.classList.remove("press"); };
  document.addEventListener("pointerdown", e => {
    const t = e.target.closest(".tape"); if (!t || e.target.closest("[data-dos],[data-cover]") || e.button > 0) return;
    el = t; fired = false; startX = e.clientX; startY = e.clientY; t.classList.add("press");

  });
  document.addEventListener("pointermove", e => { if (timer && Math.hypot(e.clientX - startX, e.clientY - startY) > 10) cancel(); });
  document.addEventListener("pointerup", cancel); document.addEventListener("pointercancel", cancel);
  document.addEventListener("click", e => { if (fired && e.target.closest(".tape")) { e.stopPropagation(); e.preventDefault(); fired = false; } }, true);
  document.addEventListener("contextmenu", e => { const t = e.target.closest(".tape"); if (!t) return; e.preventDefault();

})();

   ${tg("stFlat", "Boîtiers à plat (sans relief 3D)", s.flat === true, "Plus sobre et plus léger sur les vieux téléphones")}
   <div class="stitle">🔊 Sons</div>
   ${tg("stClick", "Clics mécaniques des touches", s.clicks !== false)}
   ${rng("stSfxVol", "Volume des clics", s.sfxVol ?? .8)}
   ${tg("stTape", "Bruit de bande en avance / retour", s.tapeSfx !== false, "Le couinement de la bande qui défile, comme un vieux dictaphone")}
   ${rng("stTapeVol", "Volume du bruit de bande", s.tapeVol ?? .7)}
   ${tg("stHiss", "Souffle de bande pendant l'écoute", !!s.hiss, "Léger « shhh » de cassette")}
   ${tg("stMotor", "Ronron du moteur pendant l'écoute", !!s.motor, "Très discret, pour l'ambiance")}
   ${tg("stVib", "Vibration au toucher des touches", s.vibrate !== false)}
   <div class="stitle">▶ Lecture</div>
   <div class="fld"><span>Bouton ◀◀ recule de</span>${seg("stBack", [5, 10, 15, 30, 60], s.back || 15, v => v + " s")}</div>
   <div class="fld"><span>Bouton ▶▶ avance de</span>${seg("stFwd", [10, 15, 30, 60, 120], s.fwd || 30, v => v + " s")}</div>
   <div class="fld"><span>Recul auto à la reprise (×3 après 30 min de pause)</span>${seg("stRw", [0, 3, 5, 10, 20], s.rewind ?? 5, v => v + " s")}</div>
   <div class="fld"><span>Vitesse par défaut</span>${seg("stSpeed", [0.8, 0.9, 1, 1.1, 1.25, 1.5, 1.75, 2], s.speed || 1, v => "×" + v)}</div>
   ${tg("stSpb", "Vitesse mémorisée par livre", !!s.speedPerBook, "Chaque livre garde sa propre vitesse")}
   <div class="fld"><span>Minuterie automatique à chaque lecture</span>${seg("stSleepDef", [0, 15, 30, 45, 60, "chap"], s.sleepDef || 0, v => v === 0 ? "Non" : v === "chap" ? "Fin chap." : v + " min")}</div>
   ${tg("stWake", "Garder l'écran allumé sur le baladeur", s.wake === true, "Seulement pendant la lecture, baladeur affiché")}
   ${tg("stTap", "Toucher la cassette = lecture / pause", s.tapCass !== false)}
   <div class="stitle">📚 Bibliothèque</div>
   ${tg("stAutoCover", "Chercher les pochettes manquantes", s.autoCover !== false, "Apple Livres, Google Livres, Open Library")}
   ${tg("stAutoSum", "Chercher les résumés", s.autoSum !== false, "Wikipédia, Apple Livres, Google Livres")}
   <div class="btns" style="margin:4px 0 6px"><button class="ib" id="fillAll">ⓘ Compléter les infos maintenant</button></div>
   <div class="stitle">💾 Sauvegarde</div>
   <p class="note" style="margin-top:0">Progression, signets, notes, critères, fiches corrigées, résumés et pochettes choisies (pas les fichiers audio). ${s.lastBackup ? "Dernière : " + new Date(s.lastBackup).toLocaleDateString("fr-FR") : "<b>Jamais faite.</b>"}</p>
   <div class="btns" style="margin:0 0 6px"><button class="ib acc" id="bkExp">💾 Sauvegarder</button><button class="ib" id="bkImp">♻ Restaurer</button></div>
   ${tg("stNag", "Rappel de sauvegarde tous les 14 jours", s.nag !== false)}
   ${storage}
   <div class="stitle">ℹ À propos</div>
   <div style="display:flex;gap:12px;align-items:center"><img src="capy-logo.png" alt="CapyCool" width="43" height="56">
   <p class="note" style="margin:0">K7 AudioB — un label <b>Kawaii App</b>. Rien n'est envoyé nulle part à part le titre et l'auteur des livres pour chercher pochettes et résumés.<br>Maintenir ◀◀/▶▶ = défilement rapide · double-tap sur VITESSE = ×1 · appui long sur un boîtier = fiche.</p></div>`);
  const redrawDeck = () => { applyLook(); render(); if (player.book) { drawDeckStatic(); updateUI(); } };
  const bindSeg = (id, key, num = true) => $("#" + id).onclick = e => { const btn = e.target.closest("[data-v]"); if (!btn) return; const v = btn.dataset.v;
    setSetting({[key]: num && !isNaN(+v) ? +v : v}); [...$("#" + id).children].forEach(x => x.classList.toggle("on", x.dataset.v === v)); sfx("press"); redrawDeck(); };
  bindSeg("stSkin", "skin", false); bindSeg("stLcd", "lcd", false); bindSeg("stTile", "tile", false);
  if ($("#stDir")) $("#stDir").onchange = e => setSetting({nativeDir: e.target.value.trim().replace(/^\/+|\/+$/g, "") || "Audiobook"});
  bindSeg("stBack", "back"); bindSeg("stFwd", "fwd"); bindSeg("stRw", "rewind"); bindSeg("stSleepDef", "sleepDef");
  $("#stSpeed").onclick = e => { const v = e.target.closest("[data-v]")?.dataset.v; if (!v) return; setSetting({speed: +v}); if (!S().speedPerBook) { A.playbackRate = +v; A.defaultPlaybackRate = +v; }
    [...$("#stSpeed").children].forEach(x => x.classList.toggle("on", x.dataset.v === v)); redrawDeck(); };
  const bindTg = (id, key, inv = false, after) => $("#" + id).onchange = e => { setSetting({[key]: e.target.checked}); sfx("press"); after?.(); };
  bindTg("stFlat", "flat", false, redrawDeck); bindTg("stClick", "clicks"); bindTg("stTape", "tapeSfx", false, () => tapeBurst(1));
  bindTg("stHiss", "hiss", false, () => hiss(!A.paused)); bindTg("stMotor", "motor", false, () => hiss(!A.paused)); bindTg("stVib", "vibrate");
  bindTg("stSpb", "speedPerBook"); bindTg("stWake", "wake", false, keepAwake); bindTg("stTap", "tapCass");
  bindTg("stAutoCover", "autoCover"); bindTg("stAutoSum", "autoSum"); bindTg("stNag", "nag");
  const bindRng = (id, key, test) => { const el = $("#" + id); el.oninput = () => { setSetting({[key]: +el.value}); $("#" + id + "V").textContent = Math.round(el.value * 10); };
    el.onchange = test; };
  bindRng("stSfxVol", "sfxVol", () => sfx("play")); bindRng("stTapeVol", "tapeVol", () => tapeBurst(1, 500));
  $("#bkExp").onclick = exportBackup;
  $("#bkImp").onclick = () => { $("#fBackup").onchange = e => { const f = e.target.files[0]; e.target.value = ""; if (f) { closeSheet(); importBackup(f); } }; $("#fBackup").click(); };
  $("#fillAll").onclick = () => { closeSheet(); fillAll(); };
}

/* ---------- apparence & options ---------- */

const SKIN_LIST = [
  ["alu88", "Alu 88", "linear-gradient(170deg,#d6dce6,#8590a3)", "K7·88", "AUTO-STOP · <em>TYPE II</em> · STÉRÉO"],
  ["bleu79", "Bleu 79", "linear-gradient(180deg,#5d82b8 0 50%,#c9ced6 50%)", "K7·79", "STEREO CASSETTE PLAYER · <em>TALK LINE</em>"],
  ["sport", "Sport jaune", "linear-gradient(170deg,#ffd51e,#d99a00)", "K7 SPORTS", "WATER RESISTANT · <em>A·R</em>"],
  ["noir85", "Noir 85", "linear-gradient(170deg,#34363d,#121317)", "K7 ‹PRO›", "METAL · <em>AUTO-REVERSE</em> · NR"],
  ["rouge", "Rouge 83", "linear-gradient(170deg,#d8343c,#7c1219)", "K7 ROUGE", "STEREO · <em>BASS BOOST</em>"],
  ["creme", "Crème 81", "linear-gradient(170deg,#f3ead6,#cdbb96)", "K7 DE LUXE", "2 HEADPHONE JACKS · <em>TYPE I</em>"],
  ["cristal", "Cristal 92", "linear-gradient(170deg,#3b3f73,#1b1d38),radial-gradient(#7ee8fa,transparent)", "K7 CLEAR", "SEE-THROUGH · <em>DIGITAL</em> · TURBO"],
];
const LCD_LIST = [["vert", "Vert", "#3dff7a"], ["ambre", "Ambre", "#ffb238"], ["cyan", "Cyan", "#59f3ff"], ["rouge", "Rouge", "#ff4d3d"], ["blanc", "Blanc", "#e7f1ff"]];
let wakeLock = null;
function applyLook(){
  const sk = SKIN_LIST.find(x => x[0] === (S().skin || "alu88")) || SKIN_LIST[0];
  $("#deck").dataset.skin = sk[0]; $("#brand").innerHTML = `<b>${sk[3]}</b><span>${sk[4]}</span>`;
  document.documentElement.dataset.lcd = S().lcd || "vert";
  $("#lib").dataset.tile = S().tile || "m"; document.body.classList.toggle("flat", S().flat === true);
  document.querySelector('meta[name="theme-color"]')?.setAttribute("content", "#14161f");
}
async function keepAwake(){
  const want = S().wake === true && !A.paused && !$("#deck").classList.contains("hide") && !document.hidden;
  try { if (want && !wakeLock) { wakeLock = await navigator.wakeLock?.request("screen"); wakeLock?.addEventListener?.("release", () => wakeLock = null); }
        else if (!want && wakeLock) { await wakeLock.release(); wakeLock = null; } } catch { wakeLock = null; }
}
document.addEventListener("visibilitychange", keepAwake);
A.addEventListener("play", keepAwake); A.addEventListener("pause", keepAwake);
A.addEventListener("play", () => { if (S().sleepDef && !player.sleep) { player.sleep = S().sleepDef === "chap" ? {mode: "chap", chap: curChapter()} : {mode: "min", end: Date.now() + S().sleepDef * 60000}; $("#mSleep").classList.add("on"); } });

/* ================================================================
   Démarrage
   ================================================================ */
// toute erreur s'affiche à l'écran (sinon invisible dans l'APK)
const showErr = m => k7diag(m);
const timeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error("délai dépassé")), ms))]);
(async function boot(){
  BE = LocalBE; let step = "chargement";
  try {
  try { await BE.load(); } catch(e) { toast("Erreur de chargement : " + e.message, 6000); }
  try { const k = JSON.parse(localStorage.getItem("k7pos") || "null");
    if (k && STATE.books && BOOKS.some(b => b.id === k.id)) { const st = bs(k.id);
      if (!(st.last >= k.last)) { st.pos = k.pos; st.last = k.last; BE.persist(true); } } } catch {}
  step = "pochettes"; await LocalBE.warmCovers(); step = "fiches"; await Info.loadAll(); step = "noms";
  for (const b of BOOKS) { // noms à points/tirets bas importés avant la correction
    if (!/\p{L}[._]\p{L}|_| [-–—] /u.test(b.title + " " + b.author) || /\.\s|\b\p{L}\.\p{L}\./u.test(b.author)) continue;
    const raw = String(b.rel || b.title).split("/").pop(), parent = String(b.rel || "").split("/").slice(-2, -1)[0] || "";
    const r = splitAT(raw, {artist: b.author}, true, parent);
    b.title = r.title; b.author = r.author; if (r.series && !b.series) b.series = r.series; if (r.reader && !b.narrator) b.narrator = r.reader;
    if (Info.get("b:" + b.id) && !Info.get("b:" + b.id).wd) Info.del("b:" + b.id);
    LocalBE.saveMeta(b);
  }
  step = "positions"; if (NATIVE) { try { const lp = await timeout(K7P.lastPositions(), 2500); // positions gardées par Android si la page a été coupée
      for (const [id, p] of Object.entries(lp || {})) if (BOOKS.some(b => b.id === id)) { const st = bs(id); if (!(st.last >= p.last)) { st.pos = {file: p.file, t: p.t}; st.last = p.last; } }
      BE.persist(true); } catch {} }
  else if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
  step = "volume"; try { A.volume = S().vol ?? 1; } catch {}
  step = "apparence"; applyLook();
  } catch(e) { showErr("Démarrage (" + step + ") : " + (e.message || e)); }
  try { render(); } catch(e) { showErr("Affichage : " + (e.message || e)); } setTimeout(() => fillAll(true), 4000);
  if (NATIVE && S().nativeScanned) setTimeout(() => nativeScan(true), 1500); // nouveaux livres du dossier : ajoutés tout seuls
  if (S().nag !== false && BOOKS.length && Date.now() - (S().lastBackup || 0) > 14 * 864e5 && Date.now() - (S().backupNag || 0) > 3 * 864e5) {
    setSetting({backupNag: Date.now()}); setTimeout(() => toast(S().lastBackup ? "💾 Pense à refaire une sauvegarde (⚙ → Sauvegarder)" : "💾 Aucune sauvegarde : ⚙ → Sauvegarder, ça prend 2 secondes", 6000), 2500); }
  const last = BOOKS.filter(b => bs(b.id).last).sort((a,b) => bs(b.id).last - bs(a.id).last)[0];
  if (last) { player.book = last; const p = bs(last.id).pos || {file:0,t:0}; loadFile(Math.min(p.file, last.files.length-1), p.t||0, false).then(() => { mediaMeta(); renderMini(); }); }
})();
</script>
